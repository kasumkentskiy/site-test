<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ПМ01</title>
<style>
  :root{
    --accent:#fbbf24;
    --bg1:#0b1023; --bg2:#141b38; --text:#e7ecf7; --muted:#9aa5c0;
    --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.12);
    --ok:#16a34a; --bad:#ef4444; --pick:#3b82f6;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1000px 600px at 15% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 60%),
      radial-gradient(800px 500px at 95% 110%, rgba(74,222,128,.10), transparent 60%),
      linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
    background-attachment:fixed;
    padding:28px 16px 60px;display:flex;flex-direction:column;align-items:center;
  }
  .wrap{width:100%;max-width:760px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
  .back{color:var(--muted);text-decoration:none;font-size:14px;border:1px solid var(--line);
        padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.04)}
  .back:hover{color:var(--text)}
  h1{font-size:clamp(22px,4vw,32px);letter-spacing:-.02em;margin-bottom:6px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:22px}
  .progress{height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-bottom:8px}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#4ade80);transition:width .25s}
  .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;
        backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .qnum{font-size:13px;color:var(--muted);margin-bottom:8px}
  .qtext{font-size:17px;line-height:1.45;margin-bottom:18px}
  .opt{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px 16px;border-radius:12px;
       border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);
       font-size:15px;line-height:1.35;cursor:pointer;transition:.15s;font-family:inherit}
  .opt:hover:not(:disabled){background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.25)}
  .opt:disabled{cursor:default}
  .opt.ok{background:rgba(22,163,74,.22);border-color:var(--ok)}
  .opt.bad{background:rgba(239,68,68,.18);border-color:var(--bad)}
  .opt.picked{background:rgba(59,130,246,.20);border-color:var(--pick)}
  .opt .mark{float:right;font-weight:700;margin-left:8px}
  .row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
  .btn{border:0;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;
       background:var(--accent);color:#0b1023;font-family:inherit}
  .btn.ghost{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--line)}
  .btn:disabled{opacity:.45;cursor:default}
  .hint{font-size:13px;color:var(--muted)}
  .menu .btn{display:block;width:100%;margin-bottom:12px;padding:16px 20px;text-align:left}
  .menu .btn small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:4px}
  .result{text-align:center}
  .result .score{font-size:44px;font-weight:800;margin:14px 0;color:var(--accent)}
  .result .pct{font-size:16px;color:var(--muted);margin-bottom:18px}
  .review{text-align:left;margin-top:18px}
  .review h3{font-size:15px;margin-bottom:10px;color:var(--muted)}
  .review .item{border-left:3px solid var(--bad);padding:8px 12px;margin-bottom:10px;background:rgba(239,68,68,.07);border-radius:0 10px 10px 0}
  .review .item .q{font-size:14px;margin-bottom:4px}
  .review .item .a{font-size:13px;color:#fca5a5}
  .review .item .b{font-size:13px;color:#86efac}
  .jumpbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .jumpbar input{width:120px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
                 background:rgba(255,255,255,.05);color:var(--text);font-family:inherit;font-size:14px}
  .jumpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;
            max-height:250px;overflow-y:auto;padding:10px;margin-bottom:12px;border-radius:14px;
            background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .jumpgrid button{padding:8px 0;border-radius:8px;border:1px solid var(--line);
                   background:rgba(255,255,255,.05);color:var(--text);font-size:12px;cursor:pointer;font-family:inherit}
  .jumpgrid button:hover{background:rgba(255,255,255,.12)}
  .jumpgrid button.cur{background:var(--accent);color:#0b1023;font-weight:700}
  .jumpgrid button.done{opacity:.5}
  @media(max-width:520px){
    body{padding:18px 10px 44px}
    h1{font-size:22px}
    .sub{font-size:13px;margin-bottom:14px}
    .card{padding:16px;border-radius:14px}
    .qtext{font-size:16px;line-height:1.4}
    .opt{font-size:14.5px;padding:13px 14px;margin-bottom:8px}
    .btn{padding:12px 16px;font-size:14px}
    .jumpbar{gap:6px}
    .jumpbar input{width:88px;font-size:14px}
    .jumpbar .hint{font-size:11px;flex-basis:100%}
    .jumpgrid{grid-template-columns:repeat(auto-fill,minmax(44px,1fr));max-height:200px}
    .meta{font-size:12px}
    .review .item .q{font-size:13.5px}
  }
</style>
</head>

  </div>
</div>

<script>
const DATA = {"questions": [{"num": 1, "text": "ИСМП – любое клинически распознанное инфекционное заболевание пациента которое получено им в результате обращения за медицинской помощью", "options": ["Только в инфекционный стационар", "Только в поликлинику", "Только в соматический стационар", "В любое ЛПУ"], "answer": 3}, {"num": 2, "text": "Потенциальными возбудителями внутрибольничных инфекций являются", "options": ["Условно - патогенные микроорганизмы", "Бактерии, которые свободно живут в окружающей среде", "Вирусы", "Платяные вши"], "answer": 0}, {"num": 3, "text": "Источниками ИСМП могут быть:", "options": ["Только пациенты", "Пациенты и бациллоносители", "Медицинский персонал", "Пациенты, носители и медицинский персонал"], "answer": 3}, {"num": 4, "text": "75-80% всех случаев ИСМП приходится на:", "options": ["Социальные инфекции", "ОРВИ", "Обычные инфекционные заболевания;", "Гнойно-септические заболевания."], "answer": 3}, {"num": 5, "text": "Наиболее вероятные факторы передачи ИСМП в ЛПУ:", "options": ["Перевязочные средства", "Препараты крови", "Руки и медицинский инструментарий", "Медикаменты"], "answer": 2}, {"num": 6, "text": "Важным этапом предупреждения профессионального заражения гемоконтактными и иными инфекциями является", "options": ["Оценка устранения факторов риска в своей работе", "Ежегодное обследование", "Обследование всех пациентов", "Уклонение от работы с инфицированными пациентами"], "answer": 0}, {"num": 7, "text": "При проведении процедур и манипуляций медсестра проводит обработку рук", "options": ["Перед процедурой", "В начале и в конце процедуры", "После нескольких процедур", "После всех процедур"], "answer": 1}, {"num": 8, "text": "Уровень мытья рук зависит от", "options": ["Степени загрязнения рук", "Вида используемых моющих средств", "Наличия перчаток", "Характера манипуляции"], "answer": 3}, {"num": 9, "text": "Для мытья рук предпочтительнее использовать", "options": ["Индивидуальное мыло", "Жидкое мыло в дозаторе", "Губки с моющим раствором", "Мыльницу с решеткой"], "answer": 1}, {"num": 10, "text": "Специфическая профилактика вирусного гепатита В заключается", "options": ["Использование одноразового инструментария", "Соблюдение режимов стерилизации и дезинфекции", "Выявление носителей вирусного гепатита", "Проведение вакцинации"], "answer": 3}, {"num": 11, "text": "В случае загрязнения рук кровью следует немедленно", "options": ["Обработать70о спиртом и вымыть их проточной водой с мылом", "Обработать дезраствором и вымыть их проточной водой с мылом", "Ничего не делать", "Вымыть их проточной водой с мылом и обработать70о спиртом"], "answer": 3}, {"num": 12, "text": ". Медицинской сестре следует пользоваться стерильными перчатками при", "options": ["Любом контакте с пациентом", "Проведении катетеризации мочевого пузыря", "Проведении дезинфекции", "Промывании желудка"], "answer": 1}, {"num": 13, "text": ". Общий процесс удаления или уничтожения микроорганизмов в целях обеспечения инфекционной безопасности объекта называется", "options": ["Дезинфекцией", "Асептикой", "Деконтаминацией", "Антисептикой"], "answer": 2}, {"num": 14, "text": "К химическому методу дезинфекции относится", "options": ["Полное погружение в раствор дезсредства", "Пароформалиновый метод", "Паровоздушный метод", "Радиационный метод"], "answer": 0}, {"num": 15, "text": "Кипячение является способом", "options": ["Только дезинфекции", "Только стерилизации", "Дезинфекции и стерилизации", "Предстерилизационной очистки"], "answer": 2}, {"num": 16, "text": "Дезинфекция уборочного инвентаря", "options": ["Кипячение", "Замачивание", "Протирание", "Промывание в проточной воде"], "answer": 1}, {"num": 17, "text": "Генеральная уборка перевязочного кабинета проводится один раз в", "options": ["Неделю", "Месяц", "2-3 Недели", "Квартал ​"], "answer": 0}, {"num": 18, "text": "Запись о проведении кварцевания процедурного кабинета делается", "options": ["Перед началом рабочей смены", "В конце рабочей смены", "После каждого кварцевания", "1 Раз в неделю"], "answer": 2}, {"num": 19, "text": "Резиновые грелки, пузыри для льда после использования обрабатывают", "options": ["Двукратно, через каждые 15 минут протирают дезинфицирующим раствором", "Погружают на 1 час в 3% раствор хлорамина", "Промывают под проточной водой", "Протирают перекисью водорода"], "answer": 0}, {"num": 20, "text": "В стационаре грязное белье от пациентов собирают", "options": ["В специальную плотную тару (клеенчатые или полиэтиленовые промаркированные мешки, специально оборудованные бельевые тележки) и передается в центральную бельевую", "В пластмассовую емкость с маркировкой, хранят в отделении 12 часов", "В полиэтиленовый пакет для мусора и передается в центральную бельевую", "В тканевые мешки с маркировкой и хранят в отделении в течение 24 часов"], "answer": 0}, {"num": 21, "text": "Отходы класса А считаются", "options": ["Неопасными", "Опасными", "Радиоактивными", "Чрезвычайно опасными"], "answer": 0}, {"num": 22, "text": "Цвет пакетов и контейнеров, предназначенных для токсичных медицинских отходов", "options": ["Красный", "Чёрный", "Любой, кроме красного и желтого", "Желтый"], "answer": 1}, {"num": 23, "text": "Ртуть из разбитых термометров относится к видам отходов", "options": ["Токсикологически опасным", "Чрезвычайно эпидемиологически опасным", "Эпидемиологически опасным", "Эпидемиологически безопасным"], "answer": 0}, {"num": 24, "text": "Фенолфталеиновая проба проводится для определения остатков", "options": ["Масляного раствора", "Крови", "Моющего средства", "Лекарственного средства"], "answer": 2}, {"num": 25, "text": "Медицинская сестра ЦСО делает запись о проведенной предстерилизационной очистке", "options": ["В журнале учета качества предстерилизационной обработки", "В журнале технического обслуживания медицинского оборудования", "В журнале учета и приема количества медицинского инструментария на стерилизацию", "В журнале учета расходного материала"], "answer": 2}, {"num": 26, "text": "Полное уничтожение микроорганизмов, спор и вирусов называется", "options": ["Дезинфекцией", "Стерилизацией", "Дезинсекцией", "Дератизацией"], "answer": 1}, {"num": 27, "text": "Щадящий режим стерилизации режущих мединструментов в воздушном стерилизаторе", "options": ["Время 150 мин, температура 160 град. С", "Время 60 мин, температура 132 град. С", "Время 60 мин, температура 180 град.", "Время 45 мин, температура 180 град. С"], "answer": 0}, {"num": 28, "text": "Стерилизация стеклянной лабораторной посуды обычно проводится", "options": ["В автоклаве", "Термостате", "Стерилизаторе", "В сухожаровом шкафу"], "answer": 3}, {"num": 29, "text": "Для контроля температуры в воздушном стерилизаторе при стерилизации инструментов применяют", "options": ["ИС 120", "ИС 132", "ИС 160", "ИС180"], "answer": 2}, {"num": 30, "text": "Наиболее надежный метод контроля стерилизации", "options": ["Механический", "Химический", "Физический", "Биологический"], "answer": 3}, {"num": 31, "text": "Упаковка материала для стерилизации проводится в ЦСО", "options": ["Приемной", "Сортировочной", "Моечной", "Упаковочной"], "answer": 3}, {"num": 32, "text": "Для воздушного метода стерилизации используют упаковки", "options": ["Бикс, бязь, крафт-бумагу", "Крафт-бумагу, перфорированный лоток", "Металлический стерилизатор, бязь", "Бикс, крафт-бумагу, лоток"], "answer": 1}, {"num": 33, "text": "Недостаточное промывание эндоскопа после стерилизации в растворе «Сайдекса» может привести", "options": ["К инфицированию пациента", "К некрозу тканей пациента", "Не влияет на пациента", "К инфицированию медицинской сестры"], "answer": 1}, {"num": 34, "text": "В основе лечебно-охранительного режима лежит", "options": ["Устранение воздействия на организм пациента неблагоприятных факторов", "Оказание экстренной помощи пациенту", "Нарушение психологического покоя", "Проведение диагностики состояния"], "answer": 0}, {"num": 35, "text": "Медицинская сестра оказывает физическую поддержку пациенту во время рентгенологического обследования и лечения", "options": ["Всегда", "Только в случае крайней необходимости", "Никогда", "Иногда"], "answer": 1}, {"num": 36, "text": "В медицинской организации используют режимы двигательной активности", "options": ["Вынужденный", "Активный", "Пассивный", "Палатный"], "answer": 3}, {"num": 37, "text": "Физическая активность имеет значение", "options": ["Только биологическое", "Не имеет ни какого значения", "Биологическое и социальное", "Только социальное"], "answer": 2}, {"num": 38, "text": "Сохранение равновесия тела при перемещении тяжести зависит от", "options": ["Осанка", "Только от физической силы", "Точки опоры, веса медицинской сестры и ее осанки", "Центра тяжести тела человека и точки опоры"], "answer": 3}, {"num": 39, "text": "Спина медицинской сестры при подъеме и перемещении пациента или груза должна быть", "options": ["Максимально прямой для данного вида перемещения", "Наклонена в противоположную перемещению сторону", "Наклонена в сторону перемещения груза", "Наклонена вперед"], "answer": 0}, {"num": 40, "text": "Для самостоятельного перемещения пациента из положения «лежа» в положение «сидя» может быть использовано оборудование:", "options": ["Эргономическая лесенка", "Скользящий рукав", "Флекси-диск", "Упоры для передвижения"], "answer": 0}, {"num": 41, "text": "в положение полулежа пациент укладывается на кровать, изголовье которой находится под углом", "options": ["10°", "90о", "60°", "45°"], "answer": 3}, {"num": 42, "text": ".Пациент идет пешком в отделение, если его состояние", "options": ["Пациент хорошо себя чувствует", "Удовлетворительное", "Средней тяжести", "Тяжелое"], "answer": 1}, {"num": 43, "text": ". Вверх по лестнице следует нести пациента", "options": ["Головой вперед", "Приподняв головной конец носилок", "Нет разницы", "Ногами вперед"], "answer": 0}, {"num": 44, "text": ". К инфекции, связанной с оказанием медицинской помощи (ИСМП), относят", "options": ["Инфекцию, передающую половым путем", "Любое инфекционное заболевание, возникшее в стационаре", "Любое клинически распознаваемое инфекционное заболевание, с которым пациент поступил в стационар", "Любое клинически распознаваемое инфекционное заболевание или осложнение, которое поражает пациента в результате его поступления в больницу или медработников, вследствие их работы в медицинской организации"], "answer": 3}, {"num": 45, "text": ". Гемо контактные инфекции – это", "options": ["Гепатиты В и С, ВИЧ", "Сальмонеллёзы", "Пневмонии", "Гнойничковые поражения кожи"], "answer": 0}, {"num": 46, "text": ". Механизм передачи сальмонеллеза", "options": ["Фекально-оральный", "Воздушно-капельный", "Трансмиссивный", "Половой"], "answer": 0}, {"num": 47, "text": "Путь распространения вируса гриппа в отделении", "options": ["Контактный непрямой", "Контактный прямой", "Воздушно-капельный", "Воздушно-пылевой"], "answer": 2}, {"num": 48, "text": ". Характерные факторы искусственного пути передачи ИСМП", "options": ["Медицинские инструменты и оборудование", "Продукты питания", "Вода", "Насекомые"], "answer": 0}, {"num": 49, "text": ". К мерам профилактики, направленным на восприимчивый организм относятся", "options": ["Использование антибактериальных препаратов", "Иммунизация", "Соблюдение санитарно-противоэпидемического режима", "Применение спец одежды"], "answer": 1}, {"num": 50, "text": ". Условия, способствующие уменьшению риска развития ИСМП в медицинских организациях", "options": ["Усиление антибактериальной терапии", "Ограничение доступа посетителей", "Сокращение инвазивных процедур", "Исключение использования пациентами домашней одежды"], "answer": 2}, {"num": 51, "text": ". Высокую степень риска контаминации представляют", "options": ["Стены, потолки, полы", "Термометры, посуда", "Гинекологическое оборудование", "Дренажи, иглы, хирургический инструментарий"], "answer": 3}, {"num": 52, "text": ". Снимая маску, ее необходимо держать за", "options": ["За центр", "За верхний край", "За нижний край", "За завязки"], "answer": 3}, {"num": 53, "text": ". Назовите перчатки, которые максимально защищают руки от порезов режущими инструментами", "options": ["Кольчужные", "Датексные", "Нитриловые", "Виниловые"], "answer": 0}, {"num": 54, "text": ". При попадании крови на кожу следует обработать ее", "options": ["70% спиртом", "3% перекисью водорода", "1% р-ром хлорамина", "1-2% р-ром протаргола"], "answer": 0}, {"num": 55, "text": ". При аварийной ситуации с биологическими жидкостями медицинская сестра должна", "options": ["Поставить в известность старшую медицинскую сестру отделения, заведующего отделением", "Обратиться к главному врачу", "Провести текущую уборку процедурного кабинета", "Уволиться"], "answer": 0}, {"num": 56, "text": ". Уничтожение в окружающей среде патогенных микроорганизмов называется", "options": ["Дератизация", "Дезинфекция", "Стерилизация", "Дезинсекция"], "answer": 1}, {"num": 57, "text": ". Заключительная дезинфекция в очаге инфекционного заболевания проводиться", "options": ["Только перед началом смены", "Только в конце смены", "В начале и в конце смены", "После выписки или перевода пациента"], "answer": 3}, {"num": 58, "text": ". Термические способы дезинфекции", "options": ["Проветривание, влажная уборка", "Влажная уборка, кипячение обжигание", "Кипячение, пастеризация, обжигание", "Прокаливание, пастеризация, кварцевание"], "answer": 2}, {"num": 59, "text": ". Инструменты, которые в процессе эксплуатации контактируют с неповрежденной кожей относятся к разряду", "options": ["Критических", "Полукритических", "Некритических", "Особо опасных"], "answer": 2}, {"num": 60, "text": ". Использованный уборочный инвентарь подлежит", "options": ["Уничтожению", "Промыванию", "Проветриванию", "Дезинфекции"], "answer": 3}, {"num": 61, "text": ". Вид уборки процедурного кабинета, которая проводится в конце рабочего дня", "options": ["Заключительная", "Текущая", "Генеральная", "Предварительная"], "answer": 0}, {"num": 62, "text": ". Проветривание в палатах должно проводиться в сутки не менее", "options": ["1 раза", "2-3 раз", "3-4 раз", "4-5 раз"], "answer": 1}, {"num": 63, "text": ". Режим дезинфекции предметов ухода из резины (грелки, пузыри для льда)", "options": ["Двухкратное протирание", "Двухкратное протирание с интервалом в 15 мин", "Кипячение", "Погружение в раствор"], "answer": 1}, {"num": 64, "text": ". Дезинфекция и стирка настельного и постельного белья инфекционного стационара проводится", "options": ["В прачечной инфекционного стационара", "В городской прачечной", "В прачечной, расположенной по соседству с терапевтическим стационаром", "Дома у каждого больного"], "answer": 0}, {"num": 65, "text": ". Отхода класса Д считаются", "options": ["Неопасными", "Опасными", "Радиоактивными", "Чрезвычайно опасными"], "answer": 2}, {"num": 66, "text": ". Радиоактивные отходы образуются", "options": ["Во всех отделениях", "В бактериологических лабораториях", "В операционных", "В отделениях лучевой диагностики и лечения"], "answer": 3}, {"num": 67, "text": ". Самоконтроль качества проведенной ПСО проводится медицинской сестрой", "options": ["Ежедневно", "1 раз в неделю", "1 раз в месяц", "1 раз в квартал"], "answer": 0}, {"num": 68, "text": ". При положительной азопирамовой пробе (наличие ржавчины) появляется окрашивание", "options": ["Сине-фиолетовое", "Сине-зеленое", "Розовое", "Бурое"], "answer": 3}, {"num": 69, "text": ". Реактив \"Судан-3\" используется для выявления на инструментах остатков:", "options": ["Жировых загрязнеий", "Лекарственных препаратов", "Моющих средств", "Дезинфицирующих растворов"], "answer": 0}, {"num": 70, "text": ". Полное уничтожение микроорганизмов, спор и вирусов называется", "options": ["Дезинфекция", "Стерилизация", "Дезинсекция", "Дератизация"], "answer": 1}, {"num": 71, "text": ". Аппарат, применяемый для стерилизации перевязочного материала", "options": ["Термостат", "Автоклав", "Сухожаровый шкаф", "Стерилизатор"], "answer": 1}, {"num": 72, "text": ". Для контроля температуры в воздушном стерилизаторе при стерилизации инструментов применяют", "options": ["ИС 120", "ИС 132", "ИС 160", "ИС180"], "answer": 2}, {"num": 73, "text": ". Метод контроля стерилизации, основанный на показателях аппаратов для стерилизации", "options": ["Т ехнический", "Химический", "Физический", "Биологический"], "answer": 2}, {"num": 74, "text": ". Преимущества централизованной стерилизации", "options": ["Высокая надежность стерилизации", "Высокий уровень рабочего труда", "Большой объем инвестиций", "Хранение обработанных медицинских изделий на стерильных столах"], "answer": 0}, {"num": 75, "text": ". Срок использования инструментов, простерилизованных в открытом виде", "options": ["В течение 24 часов с момента стерилизации", "В течение 6 часов с момента стерилизации", "Течение 12 часов с момента стерилизации", "Используются сразу"], "answer": 1}, {"num": 76, "text": ". Срок реализации эндоскопов после химической стерилизации без упаковки", "options": ["6 часов", "12 часов", "24 часа", "72 часа"], "answer": 0}, {"num": 77, "text": ". Элементы лечебно-охранительного режима госпитального режима", "options": ["Выполнение врачебных назначений", "Психологический и физический комфорт пациента", "Распорядок для лечебного отделения", "Дополнительная физическая активность"], "answer": 1}, {"num": 78, "text": ". ИСМП называется:", "options": ["Любая инфекция, появившаяся во время пребывания пациента в стационаре", "Любые инфекционные заболевания, поражающие сотрудников и/или пациентов вследствие нахождения в медицинской организации, независимо от сроков появления симптомов", "Профессиональное инфекционное заболевание медицинских работников", "Инфекционное заболевание, полученное пациентом в результате медицинской процедуры"], "answer": 1}, {"num": 79, "text": ". Первое место в структуре инфекций, связанных с оказанием медицинской помощи, занимают", "options": ["Гнойно-септические инфекции", "Инфекции кожных покровов", "Кишечные инфекции", "Инфекция мочевыводящих путей"], "answer": 0}, {"num": 80, "text": ". Путь передачи инфекции при заражении вирусным гепатитом В", "options": ["Пищевой", "Искусственный", "Воздушно-капельный", "Воздушно-пылевой"], "answer": 1}, {"num": 81, "text": ". Наиболее высокий риск развития ИСМП в отделении", "options": ["Терапии", "Хирургии", "Реанимации", "Детском"], "answer": 1}, {"num": 82, "text": ". Комплекс мероприятий, направленный на уничтожение микроорганизмов, попавших в рану или организм пациента, называется", "options": ["Асептика", "Антисептика", "Дезинфекция", "Стерилизация"], "answer": 1}, {"num": 83, "text": ". Цель дезинфекции рук медперсонала после инфекционного контакта", "options": ["Удаление бытового загрязнения", "Обеспечение кратковреиенной стерильности", "Создание продолжительной стерильности", "Профилактика профессионального заражения"], "answer": 3}, {"num": 84, "text": "Медицинский персонал меняет одноразовые медицинские маски", "options": ["Через 2 часа", "После каждой манипуляции", "Через 6 часов", "1 раз в смену"], "answer": 0}, {"num": 85, "text": ". Для размножения большинства микробов наиболее благоприятным факторами являются", "options": ["Понижение температуры и пониженная влажность", "Понижение температуры и повышенная влажность", "Повышенная температура и повышенная влажность", "Повышенная температуры и пониженная влажность"], "answer": 2}, {"num": 86, "text": ". ВИЧ поражает:", "options": ["Половую систему", "Дыхательную систему", "Иммунную систему", "Нервную систему"], "answer": 2}, {"num": 87, "text": ". Первое действие сестры при попадании в глаз биологической жидкости пациента", "options": ["Надеть маску", "Закапать раствор альбуцида", "Обильно промыть глаза", "Обратиться к окулисту"], "answer": 2}, {"num": 88, "text": "К универсальным мерам предосторожности относится правило", "options": ["Считать каждого пациента потенциально инфицированным", "Мытья рук перед выполнением инвазивных манипуляций", "Мытья рук перед уходом за тяжелобольными пациентами", "Использование антисептика для рук после инъекции"], "answer": 0}, {"num": 89, "text": "В очаге зоонозных инфекций проводится", "options": ["Дератизация", "Дезинфекция", "Стерилизация", "Дезинфекция"], "answer": 0}, {"num": 90, "text": "Дезинфекция, проводимая в очаге после удаления из него источника инфекции", "options": ["Заключительная", "Очаговая", "Профилактическая", "Текущая"], "answer": 0}, {"num": 91, "text": "По диапазону антимикробной активности дезинфектанты делятся на", "options": ["Бактерицидные, вирулоцидные, спороцидные", "Бактерицидные, фунгицидные, туберкулоцидные", "Бактерицидные, вирулоцидные, фунгицидные, туберкулоцидные, спороцидные", "Бактерицидные, туберкулоцидные, спороцидные"], "answer": 2}, {"num": 92, "text": "Применение СВЧ (свервысокие частоты) относится к методу дезинфекции", "options": ["Маханическому", "Физическому", "Химическому", "Комбинированному"], "answer": 1}, {"num": 93, "text": ". Инструменты, которые в процессе эксплуатации контактирует с кровью (стерильными тканями) относятся к разряду", "options": ["Критических", "Полукритических", "Некритических", "Особо опасных"], "answer": 0}, {"num": 94, "text": ". Для дезинфекции воздуха в помещениях могут использоваться", "options": ["Только облучатели закрытого типа", "Только облучатели открытого типа", "Комбинированные облучатели", "Все виды облучателей"], "answer": 3}, {"num": 95, "text": "Журнал проведения генаральных уборок заполняется", "options": ["после каждой генеральной уборки", "1 раз в месяц", "Ежедневно", "1 раз в 10 дней"], "answer": 0}, {"num": 96, "text": ". Облучение ультрофиолетовыми излучениями для обеззараживания воздуха и воздуха и поверхностей в помещениях относится", "options": ["К методу комбинированной дезинфекции", "К механическому методу дезинфекции", "Кхимическому методу дезинфекции", "К физическому методу дезинфекции"], "answer": 3}, {"num": 97, "text": "Подкладные судна и мочеприемники после использования", "options": ["Замачивают в дезрастворе", "Промывают проточной водой", "Протирают дезраствором", "Орошают дезраствором"], "answer": 0}, {"num": 98, "text": "Постельные принадлежности дезинфицируются в", "options": ["Автоклавах", "Сухожаровых шкафах", "Дезинфекционных камерах", "Барокамерах"], "answer": 2}, {"num": 99, "text": "Отходы класса Г считаются", "options": ["Неопасными", "Опасными", "Радиоактивными", "Токсичными"], "answer": 3}, {"num": 100, "text": "Цвет пакетов и контейнеров, предназначенных для чрезвычайно эпидемиологических опасных медицинских отходов", "options": ["Красный", "Желтый", "Белый", "Чёрный"], "answer": 0}, {"num": 101, "text": "Использованные шприцы однократного использования после дезинфекции помещают в", "options": ["Пакеты желтого цвета", "Пакеты белого цвета", "Пакеты красного цвета", "Пакеты черного цвета"], "answer": 0}, {"num": 102, "text": "Предстерилизационная очистка использованных медицинских изделий многократного применения проводится с целью", "options": ["Удаления только белковых загрязнений", "Дезинфекции", "Удаления дезинфектантов, белковых, жировых, лекарственных и др. загрязнений", "Стерилизации"], "answer": 2}, {"num": 103, "text": "Для контроля качества предстерилизационной очистки медицинских изделий проводится исследование", "options": ["Не менее 3 единиц однородных изделий от всей партии", "5 % изделий от всей партии", "10 % упаковок от всей партии", "100 % изделий, подлежащих стерилизации"], "answer": 0}, {"num": 104, "text": "Положительная азопирамовая проба на скрытую кровь дает окрашивание", "options": ["Зеленое", "Розовое", "Красное", "Фиолетовое (сине-фиолетовое)"], "answer": 3}, {"num": 105, "text": "Проба для проверки мединструментария на наличие скрытой крови называется", "options": ["Бензидиновой", "Фенолфталеиновой", "Азопирамовой", "Бензойной"], "answer": 2}, {"num": 106, "text": "Журнал учета качества предстерилизационной обработки заполняется при проведении", "options": ["Азопирамовой пробы", "Ортотолуидиновой пробы", "Бензидиновой пробы", "Озоновой пробы"], "answer": 0}, {"num": 107, "text": "Полное уничтожение микроорганизмов, спор и вирусов назы выявление и устранение различных факторов риска для медицинского персонала важнейшая задача при создании", "options": ["Безопасной больничной среды", "Лечебно-охранительного режима", "Окружающей среды", "Правил внутреннего распорядка"], "answer": 0}, {"num": 117, "text": "Наиболее частый путь проникновения токсических веществ в организм", "options": ["Пищевой", "Водный", "Через дыхательные пути", "Инъекционный"], "answer": 2}, {"num": 118, "text": "Пациент, которому не разрешено перемещаться даже в пределах кровати имеет режим двигательной активности", "options": ["Строгий постельный", "Палатный", "Постельный", "Общий"], "answer": 0}, {"num": 119, "text": "Восстановление двигательной активности пациента является профилактикой", "options": ["Пролежней", "Атрофии и контрактуры мышц", "Пневмонии", "Всего, выше перечисленного"], "answer": 3}, {"num": 120, "text": "Правильная биомеханика человека в положении \"сидя\"", "options": ["Бедра полностью находятся на сиденье, стопы чуть касаются пола", "1/2 длины бедер находятся на сиденье, стопы без напряжения касаются пола", "2/3 длины бедер находятся на сиденье, стопы без напряжения касаются пола", "1/2 длины бедер находятся на сиденье, стопы не касаются пола"], "answer": 2}, {"num": 121, "text": "Эргономическое оборудование, которое используется для облегчения самостоятельного перемещения пациента над горизонтальной поверхностью и приподнимания над ней", "options": ["Флекси-диск", "Удерживающий пояс", "Скользящая доска", "Упоры для рук"], "answer": 2}, {"num": 122, "text": "Упор для стоп обеспечивается под углом", "options": ["10 град", "45 град", "60 град", "90 град"], "answer": 3}, {"num": 123, "text": "При любом способе транспортировки пациента в отделение сопровождающий обязан", "options": ["Передать пациента и мед. карту старшей медицинской сестре", "Передать пациента и мед. карту врачу", "Оставить пициента в отделении, никому сообщать не требуется", "Передать пациента и мед. карту палатной медсестре"], "answer": 3}, {"num": 124, "text": "При транспортировке пициента на носилках идти нужно", "options": ["В ногу", "Не в ногу", "Нет разницы", "Раскачиваясь"], "answer": 0}, {"num": 125, "text": "Инфекции, связанные с оказанием медицинской помощи (исмп) развиваются только при наличии", "options": ["Источника инфекции, факторов передачи, восприимчивого человека", "Источника инфекции", "Источника инфекции, механизмов и факторов передачи"], "answer": 0}, {"num": 126, "text": ". Перед проведением инъекций медицинская сестра обрабатывает руки, включая", "options": ["Обработку 70% спиртом", "Мытьё рук мылом и водой", "Мытьё рук мылом и водой, сушку, обработку кожным антисептиком"], "answer": 2}, {"num": 127, "text": ". Среди медицинских работников к группам высокого риска заражения вирусным гепатитом В относят", "options": ["Операционных и процедурных сестер", "Персонал физиотерапевтических кабинетов", "Персонал центральных стерилизационных отделов (отделений)"], "answer": 0}, {"num": 128, "text": ". Основным фактором, влияющим на восприимчивость к инфекциям, связанным с оказанием медицинской помощи (исмп), является", "options": ["Антропометрические показатели", "Возраст человека", "Множество лечебно-диагностических процедур"], "answer": 1}, {"num": 130, "text": ". Рост заболеваемости инфекций, связанных с оказанием медицинской помощи обусловлен:", "options": ["Увеличением стрессов", "Формированием внутри госпитальных штаммов", "Снижением квалификации медицинских работников в последние годы"], "answer": 1}, {"num": 131, "text": ". Какой путь передачи отсутствует при ВИЧ-инфекции", "options": ["Вертикальный", "Инструментальный", "Пищевой"], "answer": 2}, {"num": 132, "text": ". Понятие «госпитальная инфекция» включает в себя", "options": ["Внутрибольничное заражение", "Занос инфекции-Занос инфекции и внутрибольничное заражение"], "answer": 1}, {"num": 133, "text": ". Ответственность за организацию и проведение мероприятий по профилактике ВБИ в стационаре возлагается на", "options": ["Заместителя главного врача по лечебной работе", "Главную медсестру", "Главного врача"], "answer": 2}, {"num": 134, "text": ". К противоэпидемическим средствам относят", "options": ["Культуры клеток тканей", "Вакцины", "Эритроцитарные диагностикумы"], "answer": 1}, {"num": 135, "text": ". Чаще всего заражение гнойно-септическими инфекциями происходит в", "options": ["Процедурном кабинете", "Операционной", "Коридоре"], "answer": 1}, {"num": 136, "text": ") Медицинские перчатки, загрязненные кровью пациента, следует", "options": ["Использовать далее после обработки тампоном, смоченным дезинфектантом", "Немедленно протереть тампоном, смоченным дезинфектантом, затем промыть в проточной воде, руки обработать антисептиком", "Немедленно вымыть в проточной воде, снять и затем погрузить в раствор дезинфектанта"], "answer": 1}, {"num": 137, "text": ") Группы повышенного риска заболевания госпитальными инфекциями могут формироваться прежде всего в", "options": ["Терапевтических отделениях", "Психиатрических отделениях", "Ожоговых отделениях"], "answer": 2}, {"num": 138, "text": ") Группы повышенного риска заболевания госпитальными инфекциями могут формироваться прежде всего в", "options": ["Терапевтических отделениях", "Урологических отделениях", "Неврологических отделениях"], "answer": 1}, {"num": 139, "text": ") Какую из приведенных ситуаций можно считать инфекцией, связанной с оказанием медицинской помощи:", "options": ["Три жителя одного микрорайона практически одновременно заболели дифтерией, при эпидемиологическом расследовании было установлено, что все они за 10 дней до заболевания побывали в одной стоматологической клинике", "У ребенка на 8-й день после поступления в больницу диагностирована ветряная оспа", "У двух пациентов, поступивших в ожоговое отделение, через три дня была диагностирована гнойно-септическая инфекция, при бактериологическом обследовании у обоих выделена синегнойная палочка"], "answer": 0}, {"num": 140, "text": ") Генеральная уборка процедурного и перевязо я и предметы ухода, которые подлежат предстерилизационной очистке", "options": ["Мочеприемник", "Термометр", "Гинекологические зеркала;", "Подкладные судна"], "answer": 2}, {"num": 156, "text": ") Выберите из предложенного перечня порядок мытья помещения при проведении генеральной уборки", "options": ["Пол, мебель, стены, потолок", "Мебель, стены, потолок, пол", "Стены, потолок, пол, мебель", "Потолок, стены, мебель, пол"], "answer": 3}, {"num": 157, "text": ". Генеральная уборка соматических палат проводится с периодичностью", "options": ["1 раз в 3 дня", "1 раз в 7 дней", "1 раз в 30 дней", "Ежедневно"], "answer": 2}, {"num": 158, "text": ". Генеральную уборку в режимном кабинете проводит", "options": ["Медицинская сестра под руководством старшей сестры", "Медсестра с привлечением санитарки", "Санитарка под руководством медсестры", "Санитарка под руководством сестры-хозяйки"], "answer": 2}, {"num": 159, "text": ") Дезинфекции подлежат …", "options": ["Только изделия, используемые у инфекционных больных", "Все изделия после применения их у пациентов", "Только изделия, контактировавшие с кровью", "Только хирургический инструментарий"], "answer": 1}, {"num": 160, "text": ") Для проведения азопирамовой пробы инструменты для контроля должны быть сухими и …", "options": ["«…остывшими до комнатной температуры»", "«…остывшими до 50°С»", "«…чистыми»", "«…горячими»."], "answer": 0}, {"num": 161, "text": ") Заключительная дезинфекция в медицинской организации проводится", "options": ["В рамках плановых генеральных уборок", "По распоряжению главной сестры", "В рамках ежедневных уборок", "По специальному распоряжению эпидемиолога"], "answer": 3}, {"num": 162, "text": ") Как часто медицинская сестра должна производить смену перчаток", "options": ["После каждого пациента", "После 3 пациентов", "1 раз в смену", "После 5-6 манипуляций"], "answer": 0}, {"num": 163, "text": ") Какие изделия медицинского назначения подлежат предстерилизационной очистке", "options": ["Все изделия посл ["СанПиН 2.1.3.2630-10 «Санитарно-эпидемиологические требования к организациям, осуществляющим медицинскую деятельность»", "Распоряжением старшей сестры", "Приказом главного врача", "Приказом МЗ СССР № 408 «О мерах по снижению заболеваемости вирусными гепатитами в стране»"], "answer": 0}, {"num": 174, "text": ") Медсестра при проведении пяти инъекций одному пациенту, после второй инъекции запачкала перчатку кровью. Выберите правильные действия медсестры из предложенных вариантов", "options": ["Перчатки снимаются и погружаются в дезинфектант, затем, медсестра моет руки с помощью жидкого мыла, обрабатывает руки кожным; антисептиком, надевает новые перчатки и продолжает манипуляции этому пациенту", "Перчатки очищаются сухим ватным тампоном, и медсестра продолжает проведение инъекций этому пациенту", "Медсестра обрабатывает перчатки, не снимая их с рук, вытирает их насухо и продолжает работу"], "answer": 0}, {"num": 175, "text": ") Назовите фактор передачи для инфекций с парентеральным путем заражения", "options": ["Вода", "Посуда", "Медицинский инструментарий", "Кровососущие насекомые"], "answer": 2}, {"num": 176, "text": ") Определите сроки использования рабочего раствора азопирама для оценки качества проведенной предстерилизационной очистки при температуре -25°С", "options": ["40 минут", "1 час 20 минут", "2 часа", "30 минут"], "answer": 2}, {"num": 177, "text": ") Определите сроки сохранения стерильности в биксах с бактерицидным фильтром до вскрытия", "options": ["12 часов", "6 часов", "60 суток", "20 суток"], "answer": 3}, {"num": 178, "text": "Перечислите биологические жидкости с наибольшим содержанием ВИЧ", "options": ["Кровь, ликвор, сперма, грудное молоко", "Моча", "Пот, кал", "Слюна, слеза"], "answer": 0}, {"num": 179, "text": "При попадании биологического материала на слизистые глаз необходимо", "options": ["Промыть слизистые глаз раствором перманганата калия в соотношении 1:5000", "Промыть слизистые глаз 2% раствором борной кислоты", "Промыть слизистые глаз раствором перманганата калия в соотношении 1:100", "Промыть под проточной водой (не тереть)"], "answer": 3}, {"num": 180, "text": ") При проведении контроля качества предстерилизационной очистки с применением азопирамовой пробы было получено 6 положительных проб на зажимах Кохера. Какие действия медперсонала необходимы в данной ситуации", "options": ["Персонал отстраняется от проведения обработки инструментария", "Персонал проводит повторную обработку всех инструментов, имеющих замковые части", "Персонал проводит повторную обработку 6 зажимов Кохера", "Персонал проводит повторную обработку всей партии инструментов и повторный контроль"], "answer": 3}, {"num": 181, "text": ") При проведении контроля качества предстерилизационной очистки с применением азопирамовой пробы на 6 корнцангах получено бурое окрашивание. Определите дальнейшие действия медработника", "options": ["Инструменты, давшие бурое окрашивание подлежат использованию после антикоррозийной обработки", "Инструменты, давшие бурое окрашивание, подлежат изъятию и списанию", "Проводится повторный контроль старшей медсестрой для оценки работы персонала", "Вся партия инструментария подлежит повторной пред стерилизационной очистке и повторному контролю \\​"], "answer": 0}, {"num": 182, "text": ". При проколе (порезе) руки в перчатке использованным инструментом необходимо", "options": ["Снять перчатки, погрузить в дезраствор, вымыть руки под проточной водой с мылом, обработать руки 70% раствором спирта, обработать ранку 5% спиртовым раствором йода и герметизировать ранку", "Обработать перчатку дезинфектантом, снять её и положить для дезинфекции в раствор, выдавить несколько капель крови и вымыть руки с мылом", "Выдавить из места прокола несколько капель крови и заклеить его бактерицидным пластырем", "Обработать место прокола 3% раствором перекиси водорода"], "answer": 0}, {"num": 183, "text": ". Срок сохранения стерильности в двухслойной бязевой упаковке до вскрытия составляет", "options": ["Десять суток", "Трое суток", "Шесть часов", "Одни сутки"], "answer": 1}, {"num": 184, "text": ". Текущая уборка в соматических палатах проводится с применением дезинфицирующих и моющих средств", "options": ["4 раза в день", "Только у инфекционных больных", "Не менее 2 раз в день", "1 раз в день"], "answer": 2}, {"num": 185, "text": ". Укажите, в каких случаях использование медицинских перчаток не обязательно", "options": ["При проведении термометрии", "При проведении внутривенного капельного вливания", "При проведении влагалищного обследования", "При проведении перевязок"], "answer": 0}, {"num": 186, "text": "Укажите, с какой периодичностью медицинская сестра в режимном кабинете производит смену халата", "options": ["Один раз в три дня", "После каждой серии манипуляций", "Один раз в неделю", "Каждую смену"], "answer": 3}, {"num": 187, "text": ". Что из перечисленного не входит в ВИЧ-аварийную аптечку", "options": ["Бактерицидный пластырь", "70% этиловый спирт", "Навески перманганата калия", "5% спиртовой раствор йода"], "answer": 2}, {"num": 188, "text": ". Виды дезинфекции", "options": ["Профилактическая, очаговая", "Химическая, физическая, комбинированная", "Механизированная, ручная", "Экстренная, плановая"], "answer": 0}, {"num": 189, "text": ". Методы дезинфекции", "options": ["Профилактический, очаговый", "Химический, физический, комбинированный", "Механизированный, ручной", "Экстренный, плановый"], "answer": 1}, {"num": 190, "text": ". Недостатком применения спиртсодержащих препаратов для дезинфекции является", "options": ["Легкая воспламеняемость", "Коррозионная активность", "Раздражающее действие на слизистые оболочки органов дыхания и кожу", "Слабое действие на микобактерии туберкулеза, вирусы, грибы"], "answer": 0}, {"num": 191, "text": ". При разведении дезинфицирующего средства руководствуются", "options": ["постановлениями Правительства РФ", "санитарными правилами", "инструкцией по применению конкретного средства", "распоряжениями Роспотребнадзора"], "answer": 2}, {"num": 192, "text": ". Для приготовления 3% раствора Самаровки необходимо", "options": ["3 мл средства - 1л воды", "30 мл средства - 970 мл воды", "3 мл средства - 997 мл воды", "30 мл средства - 10 л воды"], "answer": 1}, {"num": 193, "text": ") Кипячение в 2% растворе соды относится к методу дезинфекции", "options": ["Физическому", "Химическому", "Комбинированному", "Механическому"], "answer": 2}, {"num": 194, "text": ". Для контроля качества приготовления дезинфекционных растворов применяют", "options": ["Дезиконты", "Химические термоиндикаторы", "Азопирамовую пробу", "Биотесты"], "answer": 0}, {"num": 195, "text": ". При проведении заключительной дезинфекции способом орошения поверхностей не допускается", "options": ["Присутствие персонала и пациентов", "Закрывать окна и двери в помещении", "Отключать электроприборы", "Проветривать помещение после экспозиции"], "answer": 0}, {"num": 196, "text": ". Красным цветом обычно маркируют ветошь для уборки", "options": ["Туалета", "Процедурного кабинета", "Столовой", "Палат"], "answer": 0}, {"num": 197, "text": ". Длительность работы аппарата для дезинфекции воздуха в течении суток составляет", "options": ["Согласно паспорту и инструкции к аппарату, категории помещения, виду уборки", "Не менее 1 часа", "В зависимости от загрязнения помещения от 30 до 90 минут", "В зависимости от вида микроорганизмов в пробах воздуха"], "answer": 0}, {"num": 198, "text": ". Матерчатые матрасы, одеяла, подушки после выписки пациента должны", "options": ["Проветриваться", "Подвергаться обработке в дезинфекционной камере", "Отправляться в прачечную", "Отправляться в химчистку"], "answer": 1}, {"num": 199, "text": ". Влажная уборка буфетной (столовой) для пациентов должна проводится", "options": ["Не реже одного раза в день", "После каждого приема пищи (столы и пол)", "Перед началом работы и в конце рабочего дня", "После каждого приема пищи (столы) и пол не реже 1 раза в день"], "answer": 3}, {"num": 200, "text": ". Для уборки в помещениях лечебного стационара за прешены", "options": ["Пылесосы, веники", "Ведра, швабры (тряпкодержатели)", "Мопы (насадки на швабры из микрофибры)", "Квачи (ершики для чистки унитазов)"], "answer": 0}, {"num": 201, "text": ". Упаковка от одноразового шприца утилизируется в отходы класса", "options": ["А", "Б", "В", "Г"], "answer": 0}, {"num": 202, "text": ". Отходы класса «Г» должны утилизироваться в таре", "options": ["Желтого цвета", "Белого цвета", "Красного цвета", "Герметичной"], "answer": 3}, {"num": 203, "text": "Использованные шприцы в многопрофильном стационаре утилизируется в отходы", "options": ["А", "Б", "В", "Г"], "answer": 1}, {"num": 204, "text": "Использованные шприцы в госпитале для COVID-19 утилизируется в отходы класса", "options": ["А", "Б", "В", "Г"], "answer": 2}, {"num": 205, "text": ". Перчатки после инвазивной манипуляции в терапевтическом отделении утилизируется в отходы класса", "options": ["А", "Б", "В", "Г"], "answer": 1}, {"num": 206, "text": ". Многоразовую тару для сбора отходов", "options": ["Необходимо сразу после освобождения мыть и дезинфицировать", "Необходимо мыть и дезинфицировать не реже 1 раза в 3 дня", "Необходимо сразу после освобождения мыть, осушать", "Нельзя использовать, можно только одноразовую"], "answer": 0}, {"num": 207, "text": ". Дезинфицирующее средство с истекшим сроком годности", "options": ["Разводят в большом количестве воды и выливают в канализацию", "Используют быстрее, пока средство не закончится", "Выливают/высыпают в канализацию в неразведенном виде", "Утилизируют в емкости «отходы класса Д»"], "answer": 0}, {"num": 208, "text": ". Специфическая профилактика инфекционных заболеваний заключается", "options": ["В проведении санпросвет работы", "В вакцинации населения", "В мероприятиях в очаге", "Введение карантина"], "answer": 1}, {"num": 209, "text": ".Для группы кишечных инфекций ведущий путь передач", "options": ["Трансмиссивный", "Воздушно-капельный", "Алиментарный", "Контактно-бытовой"], "answer": 2}, {"num": 210, "text": ".Дезинсекция – это:", "options": ["Уничтожение грызунов", "Уничтожение насекомых", "Обеззараживание"], "answer": 1}, {"num": 211, "text": ".Отходы класса Б – это:", "options": ["Бумага, ампулы из под лекарств", "Перевязочные средства, шприцы от больных, ампулы из –под вакцин", "Ртуть, промышленные отходы"], "answer": 1}, {"num": 213, "text": "Специфическая профилактика травматизма состоит в:- Санпросвет работе с населением", "options": ["Вакцинации населения и декретированных групп против дифтерии, столбняка, газовой гангрены, ботулизма и сибирской язвы- Первичной обработке ран", "Приеме витаминов"], "answer": 0}, {"num": 214, "text": ". Для размножения большинства микробов наиболее благоприятными факторами являются:", "options": ["Понижение температуры и пониженная влажность", "Понижение температуры и повышенная влажность", "Повышенная влажность и повышенная температура", "Повышенная температура и повышенная влажность"], "answer": 2}, {"num": 215, "text": ". Для дезинфекции воздуха в помещениях могут использоваться", "options": ["Только облучатели закрытого типа", "Только облучатели открытого типа", "Комбинированные облучатели", "Все виды облучателей"], "answer": 3}, {"num": 216, "text": ". Проба для проверки медииструментария на наличие скрытой крови называется", "options": ["Бензидиновой", "Фенолфталеиновой", "Азопирамовой", "Бензойной"], "answer": 2}, {"num": 217, "text": ". Журнал учёта качества предстерилизационной обработки заполняется при проведении", "options": ["Азопирамовой пробы", "Ортотолуидиновой пробы", "Бензидиновой пробы", "Озоновой пробы"], "answer": 0}, {"num": 218, "text": ". Какой путь передачи отсутствует при ВИЧ-инфекции", "options": ["Половой", "Вертикальный", "Инструментальный", "Пищевой", "Гемотрансфузионный"], "answer": 3}, {"num": 219, "text": ". Асептика-это мероприятия, направленные на", "options": ["Предупреждение попадания микробов в рану", "Уничтожение или уменьшение количества микробов в ране или организме в целом", "Уничтожение патогенных и условно-патогенных микробов на эпидемиологических значимых объектах больничной среды", "Уничтожение всех микробов и их спор"], "answer": 0}, {"num": 220, "text": ". Одноразовые изделия медицинского назначения перед утилизацией подвергают", "options": ["Ополаскиванию проточной водой", "Мойке", "Дезинфекции", "Стерилизации"], "answer": 2}, {"num": 221, "text": ". Радиоактивные отходы ЛПУ относятся к классу", "options": ["А", "Б", "В", "Д"], "answer": 3}, {"num": 222, "text": ". В пакеты красного цвета собирают медицинские отходы класса", "options": ["А", "Б", "В", "Г"], "answer": 2}, {"num": 223, "text": ". Сбор и утилизация медицинских отходов ЛПУ проводится с целью", "options": ["Обезвреживания источника инфекции", "Разрыва путей передачи", "Повышения невосприимчивости персонала", "Выявления источника инфекции"], "answer": 1}, {"num": 224, "text": ".Использованные острые и колющие медицинские одноразовые инструменты, загрязненные биологическими жидкостями пациентов, после дезинфекции собирают в контейнеры, имеющие цвет", "options": ["Белый", "Желтый", "Красный", "Чёрный"], "answer": 1}, {"num": 225, "text": ".Пути передачи ВИЧ-инфекции и гемоконтактных гепатитов в условиях ЛПУ", "options": ["Артифициальный", "Воздушно-капельный", "Контактно-бытовой", "Алиментарный"], "answer": 0}, {"num": 226, "text": ". Основные пути передачи инфекции в ЛПУ", "options": ["Контактный, пищевой", "Пищевой, воздушно-капельный", "Воздушно-капельный, контактный", "Контактный, трансмиссивный"], "answer": 2}, {"num": 227, "text": "Обработку кожи при попадании на неё дезинфектанта проводят", "options": ["Этиловым спиртом", "Проточной водой", "Раствором фурацилина", "Перекисью водорода 6%"], "answer": 1}, {"num": 228, "text": ". Гигиеническую обработку рук проводят", "options": ["Перед и после приёма пищи", "Перед проведением инъекций", "При бытовом загрязнении рук", "После посещения туалета"], "answer": 1}, {"num": 229, "text": ". Растворы для обработки слизистой глаз медперсонала при попадании биологических жидкостей", "options": ["Проточная вода, перекись водорода", "Проточная вода, альбуцид", "Проточная вода, этиловый спирт", "Проточная вода"], "answer": 3}, {"num": 230, "text": ". Для стерилизации инструментов применяют перекись водорода, % концентрации", "options": ["1", "3", "6", "4"], "answer": 2}, {"num": 231, "text": ". Дезинфекция – комплекс мероприятий, направленных на уничтожение", "options": ["Микроорганизмов", "Грызунов", "Насекомых", "Членистоногих"], "answer": 0}, {"num": 232, "text": ". Кварцевание – метод", "options": ["Стерилизации", "Дезинсекции", "Дератизации", "Дезинфекции"], "answer": 3}, {"num": 233, "text": ". После выздоровления или смерти пациента проводят уборку", "options": ["Текущую", "Профилактическую", "Заключительную", "Очаговую ​"], "answer": 2}, {"num": 234, "text": ") Одноразовые маски требуют замены каждые", "options": ["2 часа", "4 часа", "6 часов", "12 часов"], "answer": 0}, {"num": 235, "text": ") Пути передачи ВИЧ – инфекции", "options": ["Парентеральный", "Воздушно-капельный", "Алиментарный", "Контактно-бытовой"], "answer": 0}, {"num": 236, "text": ". Какие клетки являются главной мишенью ВИЧ", "options": ["Эритроциты", "Лейкоциты", "Т-лимфоциты", "Тромбоциты"], "answer": 2}, {"num": 237, "text": ". Шприцы после дезинфекции утилизируют в отходы класса", "options": ["А", "Б", "В", "Г"], "answer": 1}, {"num": 238, "text": ". Дезинфекция изделий медицинского назначения кипячением в растворе 2% натрия гидрокарбоната проводится в течение", "options": ["1 часа", "30 минут", "15 минут", "5 минут"], "answer": 2}, {"num": 239, "text": ". Для приготовления «моющих комплексов» необходимо использовать воду", "options": ["Водопроводную", "Кипячёную", "Стерильную", "Дистиллированную"], "answer": 3}, {"num": 240, "text": ". Соотношение раствора азопирама и 3% перекиси водорода при приготовлении реактива для проведения пробы", "options": ["1:1", "1:2", "1:3", "1:4"], "answer": 0}, {"num": 241, "text": ". Температурный режим сушки ИМН перед стерилизацией в сухожаровом шкафу", "options": ["55", "65", "75", "85"], "answer": 3}, {"num": 242, "text": ". Рабочий раствор азопирама пригоден в течение", "options": ["30 минут", "1-2 часов", "12 часов", "суток"], "answer": 1}, {"num": 243, "text": ". Индикатор стерильности в паровом стерилизаторе при давлении 2 атм, экспозиции 20 минут", "options": ["ИС-120", "ИС-132", "ИС- 160", "ИС-180"], "answer": 1}, {"num": 244, "text": ". Срок стерильности изделий в стерилизационных коробках при условии ежемесячной смены фильтров, в сутках", "options": ["3", "6", "12", "20"], "answer": 3}, {"num": 245, "text": "Раствор для химической стерилизации", "options": ["6% перекись водорода", "1% р-р хлорамина", "0,5% спиртовой р-р хлоргексидина", "4% мирамистин"], "answer": 0}, {"num": 246, "text": ". Стерилизацию многоразовых металлических инструментов проводят в режиме работы сухожарового шкафа", "options": ["2 часа при 80 гр.С", "1 час при 180 гр.С", "40 минут при 100 гр.С", "90 минут при 30 гр.С"], "answer": 1}, {"num": 247, "text": ". При попадании ВИЧ-инфицированного биологического материала на кожу медсестры необходимо", "options": ["Промыть кожу водой с мылом и обработать 70% спиртом", "Обработать 70% спиртом, обмыть водой с мылом и снова 70% спиртом", "Промыть кожу водой с мылом и обработать 5% йодом", "Обработать 3% перекисью водорода"], "answer": 0}, {"num": 248, "text": ". Асептика — это комплекс мероприятий по", "options": ["Борьбе с инфекцией в ране", "Профилактике попадания инфекции в рану", "По качеству стерилизации", "Определению устойчивых штаммов микроорганизмов к антибиотикам"], "answer": 1}, {"num": 249, "text": ". Антисептика — это комплекс мероприятий по", "options": ["По уничтожению инфекции в ране", "Профилактике попадания инфекции в рану", "Определению устойчивых штаммов микроорганизмов к антибиотикам", "По качеству стерилизации"], "answer": 0}, {"num": 250, "text": ". Дезинфекция — это", "options": ["Комплекс мероприятий, предупреждающих попадание микробов в рану", "Уничтожение всех микроорганизмов, в том числе и спорообразующих", "Уничтожение патогенных микробов, без уничтожения их спор", "Механическое удаление микроорганизмов с изделий медицинского назначения"], "answer": 2}, {"num": 251, "text": ". Стерилизация — это:", "options": ["Комплекс мероприятий, предупреждающих попадание микробов в рану", "Уничтожение всех микроорганизмов, в том числе и спорообразующих", "Уничтожение патогенных микробов, без уничтожения спор", "Механическое удаление микроорганизмов с изделий медицинского назначения"], "answer": 1}, {"num": 252, "text": ". Операционное белье стерилизуют в режиме работы автоклав", "options": ["180°С — 60 мин.", "120°С — 1,1 атм. — 45 мин.", "160°С — 180 мин. 132°С — 2,0 атм. — 20 мин."], "answer": 2}, {"num": 253, "text": ". Максимальное время использования контейнера для режущих и колющих инструментов", "options": ["12 часов", "24 часа", "48 часов", "72 часа"], "answer": 1}, {"num": 254, "text": ". Срок хранения ИМН в закрытом стерильном биксе без фильтра составляет", "options": ["3 суток", "1 суток", "20 суток", "6 часов"], "answer": 0}, {"num": 255, "text": ". Стерильность бикса, из которого взят не весь материал сохраняется в течение", "options": ["6 часов", "12 часов", "10 часов", "24 часа"], "answer": 0}, {"num": 256, "text": ". Генеральная уборка процедурного кабинета стационара проводится 1 раз в", "options": ["три дня", "неделю", "10 дней", "5 дней"], "answer": 1}, {"num": 257, "text": "Тактика медсестры хирургического отделения, если рабочий дез. раствор стал мутно розовым от присутствия крови, а срок годности истекает через 10 дней", "options": ["Подогреть дез.раствор до 50℃ и продолжить работу", "Немедленно приготовить новый дез. раствор", "Приготовить новый дез. раствор в конце смены", "Сообщить старшей мед. сестре"], "answer": 1}, {"num": 258, "text": ". Для приготовления 10 литров 0,5% рабочего раствора дезинфектанта его необходимо взять в граммах", "options": ["25 грамм", "225 грамм", "50 грамм", "500 грамм"], "answer": 2}, {"num": 259, "text": ". Основной режим стерилизации инструментов многоразового использования паром под давлением", "options": ["180℃ -60 мин.", "1.1 атм. 120℃- 45 мин.", "160℃- 180 мин", "2 атм. 132℃- 20 мин"], "answer": 3}, {"num": 260, "text": ". Укажите, что из перечисленного относится к методам дезинфекции", "options": ["Физические воздействия на объект", "Орошение", "Очаговые мероприятия", "Дератизация"], "answer": 0}, {"num": 261, "text": ". Для дезинфекции использованных многоразовых инструментов не допускается проведение", "options": ["Кипячения инструментов в дистиллированной воде – 30 минут", "Кипячения инструментов в 2% растворе пищевой соды – 15 минут", "Погружения инструментария в дезинфицирующее средство", "Уничтожения инструментария."], "answer": 3}, {"num": 262, "text": ". Укажите, с какой периодичностью медицинская сестра в режимном кабинете производит смену халата", "options": ["Каждую смену", "Один раз в неделю", "Один раз в три дня", "После каждой серии манипуляций"], "answer": 0}, {"num": 263, "text": ". Укажите, в каких случаях использование медицинских перчаток не обязательно", "options": ["При проведении оперативных вмешательств", "При проведении перевязок", "При проведении внутривенного капельного вливания", "При проведении термометрии"], "answer": 3}, {"num": 264, "text": ". Укажите, как часто медицинская сестра должна производить смену перчаток", "options": ["После каждого пациента", "После 5-6 манипуляций", "После 3 пациентов", "1 раз в смену"], "answer": 0}, {"num": 265, "text": ". Для обработки инъекционного поля перед введением вакцины можно использовать", "options": ["Спирт этиловый 96%", "Спирт этиловый 70%", "0,5% спиртовой раствор хлоргексидина", "0,5% раствор хлорамина Б"], "answer": 1}, {"num": 266, "text": ". Какие изделия медицинского назначения подлежат предстерилизационной очистке", "options": ["Все изделия, подлежащие стерилизации", "Все изделия, прошедшие дезинфекцию", "Только изделия, имеющие видимые следы органических загрязнений", "Все изделия после использования"], "answer": 0}, {"num": 267, "text": ". Условия хранения хлорсодержащих дезинфицирующих средств", "options": ["Не имеют значения", "На свету", "В темном сухом помещении", "Во влажном помещении"], "answer": 2}, {"num": 268, "text": ". Для приготовления 10% осветленного раствора хлорной извести 10 л необходимо взять сухой хлорной извести (в граммах)", "options": ["1000", "500", "300", "100"], "answer": 0}, {"num": 269, "text": ". К термическому методу дезинфекции относится", "options": ["Кипячение", "Ультрафиолетовое облучение", "Двукратное протирание дезинфицирующим раствором", "Погружение в моющий раствор"], "answer": 0}, {"num": 270, "text": ". Экспозиция при дезинфекции медицинского инструментария в 3% растворе хлорамина (в мин.)", "options": ["90", "60", "30", "15"], "answer": 1}, {"num": 271, "text": "Время дезинфекции в 2% растворе Виркона изделий медицинского назначения из стекла, пластмассы и полимеров (в мин.)", "options": ["360", "60", "30", "10"], "answer": 1}, {"num": 272, "text": "Кушетку, которую используют для осмотра пациента, необходимо дезинфицировать", "options": ["После каждого пациента", "Один раз в день", "В конце смены", "Во время генеральной уборки"], "answer": 0}, {"num": 273, "text": ". Механический метод дезинфекции", "options": ["Проветривание", "Кварцевание", "Обжигание", "Кипячение"], "answer": 0}, {"num": 274, "text": ". Профилактическую дезинфекцию проводят", "options": ["Вокруг больного", "Вокруг носителя", "После выздоровления больного", "Для предупреждения распространения инфекции"], "answer": 3}, {"num": 275, "text": ". Этапы обработки инструментария", "options": ["Дезинфекция - предстерилизационная обработка - стерилизация", "Предстерилизационная обработка - дезинфекция - стерилизация", "Дезинфекция - стерилизация", "Предстерилизационная обработка – стерилизация"], "answer": 0}, {"num": 276, "text": ". Аппарат, применяем , {"num": 294, "text": ". Профилактические мероприятия по вирусному гепатиту проводится в соответствии с приказом №:", "options": ["408​", "288", "342", "720"], "answer": 0}, {"num": 295, "text": ". Организация санитарно-противоэпидемического режима хирургического стационара регламентируется приказом №:", "options": ["916", "720", "288", "408"], "answer": 1}, {"num": 296, "text": ". Профилактика педикулеза проводится в соответствии с приказом №:", "options": ["408", "916", "342", "720"], "answer": 2}, {"num": 297, "text": ". Эпидемический процесс состоит из", "options": ["Трех различных возбудителей", "Трех взаимосвязанных звеньев", "Передач заболеваний от одного к другому", "Путей передачи"], "answer": 1}, {"num": 298, "text": ". Механизм передачи вирусного гепатита", "options": ["Фекально-оральный", "Аэрогенный", "Парентеральный", "Трансмиссивный"], "answer": 2}, {"num": 299, "text": ". Парентеральный путь передачи инфекции характерен для всех заболеваний, кроме", "options": ["Вирусный гепатит В", "Вирусный гепатит С", "ВИЧ-инфекция", "Вирусный гепатит А"], "answer": 3}, {"num": 300, "text": ".Рост заболеваемости инфекций, связанных с оказанием медицинской помощи обусловлен", "options": ["Увеличением стрессов", "Формированием внутригоспитальных штаммов", "Снижением квалификации медицинских работников в последние годы"], "answer": 1}]};
const ALL = DATA.questions;
const EXAM_SIZE = 20;
let mode = 'train', queue = [], idx = 0, correct = 0, wrong = [], picks = [];

const el = (id) => document.getElementById(id);

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function toMenu() {
  el('menu').style.display = 'block';
  el('quiz').style.display = 'none';
  el('done').style.display = 'none';
}

// ── переход к любому вопросу ──
function buildJump() {
  const g = el('jumpgrid');
  g.innerHTML = '';
  queue.forEach((q, k) => {
    const b = document.createElement('button');
    b.textContent = q.num;
    b.dataset.k = k;
    b.onclick = () => goTo(k);
    g.appendChild(b);
  });
  markJump();
}

function markJump() {
  const g = el('jumpgrid');
  if (!g) return;
  [...g.children].forEach((b) => b.classList.toggle('cur', Number(b.dataset.k) === idx));
}

function goTo(k) {
  if (k < 0 || k >= queue.length) return;
  clearTimeout(window.__adv);
  idx = k;
  render();
}

function start(m) {
  mode = m;
  clearTimeout(window.__adv);
  queue = (m === 'exam') ? shuffle(ALL).slice(0, Math.min(EXAM_SIZE, ALL.length)) : shuffle(ALL);
  idx = 0; correct = 0; wrong = []; picks = [];
  el('menu').style.display = 'none';
  el('done').style.display = 'none';
  el('quiz').style.display = 'block';
  buildJump();
  render();
}

function render() {
  const q = queue[idx];
  el('qpos').textContent = 'Вопрос ' + (idx + 1) + ' из ' + queue.length;
  el('score').textContent = mode === 'exam' ? 'Отвечено: ' + picks.length : 'Правильно: ' + correct;
  el('pbar').style.width = (idx / queue.length * 100) + '%';
  el('next').disabled = true;
  el('status').textContent = '';
  markJump();
  const card = el('card');
  card.innerHTML = '<div class="qnum">№ ' + q.num + '</div><div class="qtext"></div>';
  card.querySelector('.qtext').textContent = q.text;
  q.options.forEach((opt, k) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => pick(b, k, q);
    card.appendChild(b);
  });
}

function pick(btn, k, q) {
  const buttons = [...document.querySelectorAll('.opt')];
  buttons.forEach(b => b.disabled = true);
  picks.push(k);

  const right = q.answer;
  if (mode === 'train') {
    if (right >= 0) {
      buttons[right].classList.add('ok');
      buttons[right].insertAdjacentHTML('beforeend', '<span class="mark">✓</span>');
    }
    if (k === right) { correct++; el('status').textContent = 'Верно ✓'; }
    else {
      btn.classList.add('bad');
      btn.insertAdjacentHTML('beforeend', '<span class="mark">✗</span>');
      el('status').textContent = right >= 0 ? 'Неверно ✗' : 'Ответ не размечен';
    }
    el('score').textContent = 'Правильно: ' + correct;
  } else {
    // экзамен: без подсказок
    btn.classList.add('picked');
    el('status').textContent = 'Отвечено · далее…';
    if (k !== right) wrong.push({q, k});
  }

  el('next').disabled = false;
  clearTimeout(window.__adv);
  window.__adv = setTimeout(() => { if (!el('next').disabled) el('next').click(); }, 1000);
}

el('next').onclick = () => {
  clearTimeout(window.__adv);
  if (idx < queue.length - 1) { idx++; render(); }
  else { finish(); }
};

// кнопка «Список вопросов»
el('toggleJump').onclick = () => {
  const g = el('jumpgrid');
  g.style.display = (g.style.display === 'none') ? 'grid' : 'none';
};

// переход по номеру вопроса
el('goNum').onclick = () => {
  const n = parseInt(el('jumpNum').value, 10);
  if (!n) return;
  const k = queue.findIndex((q) => q.num === n);
  if (k >= 0) { goTo(k); el('jumpNum').value = ''; }
  else { el('status').textContent = 'Вопроса №' + n + ' нет в этом списке'; }
};
el('jumpNum').addEventListener('keydown', (e) => { if (e.key === 'Enter') el('goNum').click(); });

function finish() {  el('quiz').style.display = 'none';
  el('done').style.display = 'block';
  el('pbar').style.width = '100%';
  const total = queue.length;
  const rights = mode === 'exam' ? (total - wrong.length) : correct;
  el('finalScore').textContent = rights + ' / ' + total;
  el('finalPct').textContent = Math.round(rights / total * 100) + '% правильных' +
      (mode === 'exam' ? ' · экзамен' : ' · тренировка');

  const rev = el('review');
  rev.innerHTML = '';
  if (mode === 'exam' && wrong.length) {
    const h = document.createElement('h3');
    h.textContent = 'Ошибки (' + wrong.length + '):';
    rev.appendChild(h);
    wrong.forEach(({q, k}) => {
      const it = document.createElement('div');
      it.className = 'item';
      it.innerHTML = '<div class="q"></div><div class="a"></div><div class="b"></div>';
      it.querySelector('.q').textContent = '№ ' + q.num + '. ' + q.text;
      it.querySelector('.a').textContent = 'Ваш ответ: ' + (q.options[k] || '—');
      it.querySelector('.b').textContent = 'Правильно: ' + (q.answer >= 0 ? q.options[q.answer] : 'не размечено');
      rev.appendChild(it);
    });
  }
}

</script>
