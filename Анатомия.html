<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f2742">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Анатомия</title>
<style>
  :root{
    --accent:#60a5fa;
    --bg1:#0b1023; --bg2:#141b38; --text:#e7ecf7; --muted:#9aa5c0;
    --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.12);
    --ok:#16a34a; --bad:#ef4444; --pick:#3b82f6;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1000px 600px at 15% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 60%),
      radial-gradient(800px 500px at 95% 110%, rgba(74,222,128,.10), transparent 60%),
      linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
    background-attachment:fixed;
    padding:28px 16px 60px;display:flex;flex-direction:column;align-items:center;
  }
  .wrap{width:100%;max-width:760px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
  .back{color:var(--muted);text-decoration:none;font-size:14px;border:1px solid var(--line);
        padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.04)}
  .back:hover{color:var(--text)}
  h1{font-size:clamp(22px,4vw,32px);letter-spacing:-.02em;margin-bottom:6px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:22px}
  .progress{height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-bottom:8px}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#4ade80);transition:width .25s}
  .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;
        backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .qnum{font-size:13px;color:var(--muted);margin-bottom:8px}
  .qtext{font-size:17px;line-height:1.45;margin-bottom:18px}
  .opt{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px 16px;border-radius:12px;
       border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);
       font-size:15px;line-height:1.35;cursor:pointer;transition:.15s;font-family:inherit}
  .opt:hover:not(:disabled){background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.25)}
  .opt:disabled{cursor:default}
  .opt.ok{background:rgba(22,163,74,.22);border-color:var(--ok)}
  .opt.bad{background:rgba(239,68,68,.18);border-color:var(--bad)}
  .opt.picked{background:rgba(59,130,246,.20);border-color:var(--pick)}
  .opt .mark{float:right;font-weight:700;margin-left:8px}
  .row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
  .btn{border:0;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;
       background:var(--accent);color:#0b1023;font-family:inherit}
  .btn.ghost{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--line)}
  .btn:disabled{opacity:.45;cursor:default}
  .hint{font-size:13px;color:var(--muted)}
  .menu .btn{display:block;width:100%;margin-bottom:12px;padding:16px 20px;text-align:left}
  .menu .btn small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:4px}
  .result{text-align:center}
  .result .score{font-size:44px;font-weight:800;margin:14px 0;color:var(--accent)}
  .result .pct{font-size:16px;color:var(--muted);margin-bottom:18px}
  .review{text-align:left;margin-top:18px}
  .review h3{font-size:15px;margin-bottom:10px;color:var(--muted)}
  .review .item{border-left:3px solid var(--bad);padding:8px 12px;margin-bottom:10px;background:rgba(239,68,68,.07);border-radius:0 10px 10px 0}
  .review .item .q{font-size:14px;margin-bottom:4px}
  .review .item .a{font-size:13px;color:#fca5a5}
  .review .item .b{font-size:13px;color:#86efac}
  .jumpbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .jumpbar input{width:120px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
                 background:rgba(255,255,255,.05);color:var(--text);font-family:inherit;font-size:14px}
  .jumpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;
            max-height:250px;overflow-y:auto;padding:10px;margin-bottom:12px;border-radius:14px;
            background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .jumpgrid button{padding:8px 0;border-radius:8px;border:1px solid var(--line);
                   background:rgba(255,255,255,.05);color:var(--text);font-size:12px;cursor:pointer;font-family:inherit}
  .jumpgrid button:hover{background:rgba(255,255,255,.12)}
  .jumpgrid button.cur{background:var(--accent);color:#0b1023;font-weight:700}
  .jumpgrid button.done{opacity:.5}
  @media(max-width:520px){
    body{padding:18px 10px 44px}
    h1{font-size:22px}
    .sub{font-size:13px;margin-bottom:14px}
    .card{padding:16px;border-radius:14px}
    .qtext{font-size:16px;line-height:1.4}
    .opt{font-size:14.5px;padding:13px 14px;margin-bottom:8px}
    .btn{padding:12px 16px;font-size:14px}
    .jumpbar{gap:6px}
    .jumpbar input{width:88px;font-size:14px}
    .jumpbar .hint{font-size:11px;flex-basis:100%}
    .jumpgrid{grid-template-columns:repeat(auto-fill,minmax(44px,1fr));max-height:200px}
    .meta{font-size:12px}
    .review .item .q{font-size:13.5px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← Все предметы</a>
    <span class="hint" id="counter"></span>
  </div>
  <h1>Анатомия</h1>
  <div class="sub">Всего вопросов: <b>287</b></div>

  <div id="menu" class="card menu">
    <button class="btn" onclick="start('train','seq')">🎯 Тренировка — все 287 по порядку<small>Вопросы идут по номеру, сразу видно ответ</small></button>
    <button class="btn ghost" onclick="start('train','rand')">🔀 Тренировка — все 287 вразброс<small>Перемешаны, сразу видно ответ</small></button>
    <button class="btn ghost" onclick="start('exam',20)">📝 Экзамен — 20 случайных<small>Без подсказок, разбор ошибок в конце</small></button>
    <button class="btn ghost" onclick="start('exam',50)">📝 Экзамен — 50 случайных<small>Без подсказок, разбор ошибок в конце</small></button>
  </div>

  <div id="quiz" style="display:none">
    <div class="jumpbar">
      <button class="btn ghost" id="toggleJump">📋 Список вопросов</button>
      <input id="jumpNum" type="number" min="1" placeholder="№ вопроса">
      <button class="btn ghost" id="goNum">→</button>
      <span class="hint">можно перейти к любому вопросу</span>
    </div>
    <div class="jumpgrid" id="jumpgrid" style="display:none"></div>
    <div class="progress"><i id="pbar"></i></div>
    <div class="meta"><span id="qpos"></span><span id="score"></span></div>
    <div class="card" id="card"></div>
    <div class="row">
      <button class="btn" id="next" disabled>Далее →</button>
      <span class="hint" id="status"></span>
    </div>
  </div>

  <div id="done" style="display:none" class="card result">
    <h2>Результат</h2>
    <div class="score" id="finalScore">0</div>
    <div class="pct" id="finalPct"></div>
    <div class="review" id="review"></div>
    <div class="row" style="justify-content:center;margin-top:20px">
      <button class="btn" onclick="start(mode, lastSize)">Ещё раз</button>
      <button class="btn ghost" onclick="toMenu()">К выбору режима</button>
    </div>
  </div>
</div>

<script>
const DATA = {"questions": [{"num": 1, "text": "Индивидуальное развитие организма называется:", "options": ["эмбриогенезом", "гаметогенезом", "онтогенезом", "филогенезом"], "answer": 2}, {"num": 2, "text": "Процесс индивидуального развития включает в себя периоды:", "options": ["постмитотический", "пресинтетический", "синтетический", "пренатальный, постнатальный"], "answer": 3}, {"num": 3, "text": "Для постэмбрионального периода человека характерно:", "options": ["рост организма, увеличение массы", "закладка основных органов", "закладка половых желёз", "закладка головного и спинного мозга"], "answer": 0}, {"num": 4, "text": "Фронтальная плоскость делит тело человека на части:", "options": ["переднюю и заднюю", "левую и правую"], "answer": 0}, {"num": 5, "text": "Сагиттальная плоскость делит тело человека на части:", "options": ["переднюю и заднюю", "левую и правую"], "answer": 1}, {"num": 6, "text": "Анатомический термин \"дистальный\" обозначает:", "options": ["ближе к началу конечности", "ближе к задней поверхности тела", "дальше от начала конечности"], "answer": 2}, {"num": 7, "text": "Горизонтальная плоскость делит тело человека на части:", "options": ["верхнюю, нижнюю", "переднюю, заднюю"], "answer": 0}, {"num": 8, "text": "Анатомический термин \"каудальный\" обозначает:", "options": ["передний", "верхний", "нижний", "дорсальный"], "answer": 2}, {"num": 9, "text": "Срединная плоскость делит тело человека:", "options": ["на левую и правую части", "на переднюю и заднюю половины", "на верхнюю и нижнюю половины"], "answer": 0}, {"num": 10, "text": "Элементарной живой системой, способной к самообновлению, саморегуляции и самовоспроизведению, является:", "options": ["росток", "семя", "клетка", "зигота"], "answer": 2}, {"num": 11, "text": "Клетки, имеющие хорошо оформленное ядро, называются:", "options": ["прокариотами", "доклеточными", "эукариотами", "сапрофитами"], "answer": 2}, {"num": 12, "text": "В состав любой клетки входят химические вещества:", "options": ["минеральные", "синтетические", "неорганические", "биохимические"], "answer": 2}, {"num": 13, "text": "Нуклеиновой кислотой, хранящую информацию о структуре белков, является:", "options": ["т-РНК", "ДНК", "р-РНК", "и-РНК"], "answer": 1}, {"num": 14, "text": "Протеином называется:", "options": ["глюкоза", "аминокислота", "белок", "жир"], "answer": 2}, {"num": 15, "text": "Осмотическое давление клетки обусловлено:", "options": ["белком", "АТФ", "хлоридом натрия", "жиром"], "answer": 2}, {"num": 16, "text": "Наследственные свойства клетки несёт:", "options": ["ядерная оболочка", "ядерный сок", "хромосома", "ядрышки"], "answer": 2}, {"num": 17, "text": "Основными структурными компонентами эукариотической клетки являются:", "options": ["ядро", "оболочка", "цитоплазма", "мембрана"], "answer": 0}, {"num": 18, "text": "Нуклеиновая кислота, являющаяся «матрицей», на которой производится «сборка» молекулы белка – это:", "options": ["т-РНК", "ДНК", "р-РНК", "и-РНК"], "answer": 3}, {"num": 19, "text": "Углеводом, входящим в состав ДНК, является:", "options": ["дезоксирибоза", "галактоза", "глюкоза", "4-рибоза"], "answer": 0}, {"num": 20, "text": "Яйцеклетка организма человека содержит набор хромосом:", "options": ["диплоидный", "тетраплоидный", "гаплоидный", "полиплоидный"], "answer": 2}, {"num": 21, "text": "Функции, выполняемой митохондрией в клетке, является:", "options": ["выделительная", "передача генетической информации", "энергетическая", "синтез белка"], "answer": 2}, {"num": 22, "text": "Соматическая клетка организма человека содержит набор хромосом:", "options": ["диплоидный", "тетраплоидный", "гаплоидный", "полиплоидный"], "answer": 0}, {"num": 23, "text": "Жиры состоят:", "options": ["из нуклеотидов", "из глюкозы", "из аминокислот", "из глицерина и высокомолекулярных кислот"], "answer": 3}, {"num": 24, "text": "Для сперматозоида характерно:", "options": ["подвижность", "неподвижность", "большой запас питательных веществ", "диплоидный набор хромосом"], "answer": 0}, {"num": 25, "text": "Жизненный цикл клетки – это:", "options": ["процесс, проходящий в половых клетках", "размножение клеток", "процесс, происходящий в клетке от момента её закладки до физической гибели", "размножение клеток и их развитие"], "answer": 2}, {"num": 26, "text": "Аксон обеспечивает проведение импульса:", "options": ["от нервной клетки к рабочему органу", "к телу клетки", "от одной клетки к другой"], "answer": 0}, {"num": 27, "text": "Нуклеиновые кислоты в клетке осуществляют:", "options": ["хранение и передачу наследственных свойств", "питание клетки", "терморегуляцию", "движение"], "answer": 0}, {"num": 28, "text": "Половые клетки образуются:", "options": ["в половых железах", "в матке", "в маточных трубах", "в половых путях"], "answer": 0}, {"num": 29, "text": "Половое размножение – это:", "options": ["деление клетки на две дочерние", "формирование клона из одной материнской клетки", "увеличение числа особей за счёт миграции с других территорий", "увеличение числа особей из одной родительской пары"], "answer": 3}, {"num": 30, "text": "Способ деления клетки, лежащий в основе бесполого размножения организмов:", "options": ["митоз", "конъюгация", "кроссинговер"], "answer": 0}, {"num": 31, "text": "Чувствительное окончание нервного волокна называется:", "options": ["рецептором", "аксоном", "дендритом", "нейритом"], "answer": 0}, {"num": 32, "text": "Амитоз – это правильный ответ:", "options": ["непрямое деление", "деление половых клеток", "прямое деление", "клеточный цикл"], "answer": 0}, {"num": 33, "text": "Внутреннюю среду организма от внешней среды отделяет ткань:", "options": ["соединительная", "эпителиальная", "мышечная", "нервная"], "answer": 1}, {"num": 34, "text": "Костеобразующую функцию:", "options": ["остеоциты", "остеобласты", "хондроциты", "остеокласты"], "answer": 1}, {"num": 35, "text": "Кожа выстлана эпителием:", "options": ["кубическим", "цилиндрическим", "переходным", "многослойным плоским ороговевающим"], "answer": 3}, {"num": 36, "text": ии", "клеточный центр"], "answer": 2}, {"num": 217, "text": "Опыты Менделя подтвердили:", "options": ["Леван и Тио", "Р.Гук", "Де Фриз и Корренс", "Уотсон и Крик"], "answer": 2}, {"num": 218, "text": "Молекула РНК содержит:", "options": ["Урацил", "АТФ", "липиды", "Белок"], "answer": 0}, {"num": 219, "text": "Участок молекулы ДНК, кодирующий первичную структуру полипептида:", "options": ["триплет", "ген", "генетический код", "хроматин"], "answer": 1}, {"num": 220, "text": "Образование мужских половых клеток называется:", "options": ["онтогенез", "сперматогенез", "мейоз", "митоз"], "answer": 1}, {"num": 221, "text": "Участок молекулы ДНК, состоящий из трех нуклеотидов:", "options": ["Ген", "Генотип", "Триплет", "Генетический код"], "answer": 2}, {"num": 222, "text": "Прямое деление клетки это:", "options": ["митоз", "мейоз", "гаметогенез", "амитоз"], "answer": 3}, {"num": 223, "text": "Термин «генетика» предложил:", "options": ["Иогансен", "Бэтсон", "Морган", "Мендель"], "answer": 1}, {"num": 224, "text": "Ген, находящийся в скрытом состоянии:", "options": ["Доминантный", "Рецессивный", "Мутагенный", "Экспрессивный"], "answer": 1}, {"num": 225, "text": "Ген, преобладающий и подавляющий действие других генов:", "options": ["доминантный", "рецессивный", "мутагенный", "экспрессивный"], "answer": 0}, {"num": 226, "text": "Совокупность всех генов у одной особи:", "options": ["фенотип", "генотип", "триплет", "кариотип"], "answer": 1}, {"num": 227, "text": "Соотношение по фенотипу при моногибридном скрещивании:", "options": ["1:2:1", "9:3:3:1", "3:1", "9:7"], "answer": 2}, {"num": 228, "text": "По Х-сцепленному типу наследуется:", "options": ["альбинизм", "гемофилия", "многопалость", "умение свертывать язык в трубочку"], "answer": 1}, {"num": 229, "text": "По аутосомно- рецессивному типу наследуется:", "options": ["первая группа крови", "вторая группа крови", "третья группа крови", "четвертая группа крови"], "answer": 0}, {"num": 230, "text": "Организм, в котором пара аллел ", "эпистаз"], "answer": 3}, {"num": 242, "text": "Организм с генотипом АаbbСс образует следующие типы гамет:", "options": ["AbC, Abс, аbс, аbС", "Аb, АС, аВ, аС", "Ас, АС, аb, ас", "АbС, аВС, Аbс,аВс"], "answer": 0}, {"num": 243, "text": "Организм с генотипом АаВв образует следующие типы гамет:", "options": ["АВ, АВ, ав, ав", "АВ,А,В", "Ав, АВ, аВ, ав", "Аа, АА, ВВ, Вв"], "answer": 2}, {"num": 244, "text": "Женщина, отец которой был гемофиликом, вышла замуж за мужчину, отец которого был также гемофиликом. Какое суждение о здоровье их детей верно:", "options": ["все их дети будут здоровы", "все их дети будут больными", "сыновья будут здоровыми, половина дочерей больными", "дочери фенотипически будут здоровыми, половина сыновей больными"], "answer": 3}, {"num": 245, "text": "Наследственное заболевание, характеризующееся нарушением цветового зрения-это:", "options": ["ихтиоз", "астигматизм", "дальтонизм", "альбинизм"], "answer": 2}, {"num": 246, "text": "Генотипическое единообразие у потомков возможно при генотипах родителей:", "options": ["Аа х Аа", "Аа х аа", "АА х Аа", "АА х аа"], "answer": 3}, {"num": 247, "text": "Неполное доминирование подразумевает:", "options": ["наличие домиантного гена только, а X хромосоме мужской особи", "расположение доминантного гена в Ухромосоме", "проявление промежуточного фенотипа при гетерозиготном генотипе", "отсутствие в кариотипе одной хромосомы с доминантным геном"], "answer": 2}, {"num": 248, "text": "Сибсы это:", "options": ["родители", "братья и сестры", "бабушки и дедушки", "племянники"], "answer": 1}, {"num": 249, "text": "Гетерозиготный носитель патологического гена:", "options": ["кондуктор", "пробанд", "сибс", "гибрид"], "answer": 0}, {"num": 250, "text": "Человек, обратившийся за генетической консультацией:", "options": ["сибс", "кондуктор", "носитель гена", "пробанд"], "answer": 3}, {"num": 251, "text": "С помощью какого метода выявляется влияние генотипа и среды на развитие ребенка", "options": ["генеалогического", "близнецового", "цитогенетического", "гибридологического"], "answer": 1}, {"num": 252, "text": "Метод изучения наследственности человека, в основе которого лежит изучение числа хромосом, особенностей их строения, называют", "options": ["генеалогическим", "близнецовым", "гибридологическим", "цитогенетическим"], "answer": 3}, {"num": 253, "text": "С помощью генеалогического метода можно выяснить характер изменения генов:", "options": ["влияние воспитания на развитие психических особенностей человека", "закономерности наследования признаков у человека", "характер изменения хромосом"], "answer": 1}, {"num": 254, "text": "Исследуя аминокислотный состав гемоглобина, ученые используют:", "options": ["близнецовый метод;", "цитогенетический метод;", "генеалогический метод;", "биохимический метод"], "answer": 3}, {"num": 255, "text": "Если анализируемый признак в родословной встречается несколько раз в разных поколениях, то можно предположить, что этот признак:", "options": ["сцеплен с полом;", "аутосомный;", "не имеет наследственную природу", "имеет наследственную природу"], "answer": 3}, {"num": 256, "text": "Дальтонизм наследуется по … типу:", "options": ["аутосомно-доминантному;", "аутосомно-рецессивному;", "доминантному, сцепленному с Х- хромосомой;", "рецессивному, сцепленному с Х- хромосомой"], "answer": 3}, {"num": 257, "text": "С помощью … метода было показано, что продолжительность жизни, и творческие способности человека, в большей степени определяются наследственностью, а не влиянием воспитания и действием окружающей среды:", "options": ["генеалогического;", "близнецового", "цитогенетического;", "биохимического."], "answer": 1}, {"num": 258, "text": "Близнецы, развивающиеся из одной яйцеклетки, называются:", "options": ["дизиготные;", "монозиготные", "двуяйцевыми;", "неидентичными."], "answer": 1}, {"num": 259, "text": "Различие признаков у монозиготных близнецов зависит:", "options": ["только от генотипа;", "только от факторов внешней среды;", "от генотипа и среды в um": 295, "text": "Пренатальная диагностика – это:", "options": ["комплекс мероприятий, направленных на предупреждение развития заболевание у ребенка", "мероприятия по предотвращению беременности при высоком риске рождения больного ребенка", "диагностика болезни у эмбриона или плода", "оценка риска развития заболевания будущего ребенка"], "answer": 2}, {"num": 296, "text": "Где расположена центромера на хромосоме?", "options": ["на первичной перетяжке", "на вторичной перетяжке.", "на третичной перетяжке", "на четвертичной перетяжке"], "answer": 0}, {"num": 297, "text": "Какой органоид образует нити веретена деления?", "options": ["комплекс Гольджи;", "клеточный центр", "рибосома;", "эндоплазматическая сеть"], "answer": 1}, {"num": 298, "text": "Как называется участок хромосомы, к которому крепятся нити веретена деления?", "options": ["центромера", "теломера;", "спутник;", "хроматида."], "answer": 0}, {"num": 299, "text": "Органоиды клетки, образующие и накапливающие АТФ.", "options": ["лизосомы", "рибосомы", "митохондрии", "клеточный центр"], "answer": 2}, {"num": 300, "text": "Наследственное заболевание, характеризующееся нарушением цветового зрения — это:", "options": ["ихтиоз", "астигматизм", "дальтонизм", "альбинизм"], "answer": 2}]};
const ALL = DATA.questions;
const EXAM_SIZE = 20;
let mode = 'train', lastSize = 0, queue = [], idx = 0, correct = 0, wrong = [], picks = [];

const el = (id) => document.getElementById(id);

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function toMenu() {
  el('menu').style.display = 'block';
  el('quiz').style.display = 'none';
  el('done').style.display = 'none';
}

// ── переход к любому вопросу ──
function buildJump() {
  const g = el('jumpgrid');
  g.innerHTML = '';
  queue.forEach((q, k) => {
    const b = document.createElement('button');
    b.textContent = q.num;
    b.dataset.k = k;
    b.onclick = () => goTo(k);
    g.appendChild(b);
  });
  markJump();
}

function markJump() {
  const g = el('jumpgrid');
  if (!g) return;
  [...g.children].forEach((b) => b.classList.toggle('cur', Number(b.dataset.k) === idx));
}

function goTo(k) {
  if (k < 0 || k >= queue.length) return;
  clearTimeout(window.__adv);
  idx = k;
  render();
}

function start(m, size) {
  mode = m;
  lastSize = size;
  clearTimeout(window.__adv);
  if (m === 'train') {
    queue = (size === 'seq') ? ALL.slice() : shuffle(ALL);
  } else {
    queue = shuffle(ALL).slice(0, Math.min(Number(size) || 20, ALL.length));
  }
  idx = 0; correct = 0; wrong = []; picks = [];
  el('menu').style.display = 'none';
  el('done').style.display = 'none';
  el('quiz').style.display = 'block';
  buildJump();
  render();
}

function render() {
  const q = queue[idx];
  el('qpos').textContent = 'Вопрос ' + (idx + 1) + ' из ' + queue.length;
  el('score').textContent = mode === 'exam' ? 'Отвечено: ' + picks.length : 'Правильно: ' + correct;
  el('pbar').style.width = (idx / queue.length * 100) + '%';
  el('next').disabled = true;
  el('status').textContent = '';
  markJump();
  const card = el('card');
  card.innerHTML = '<div class="qnum">№ ' + q.num + '</div><div class="qtext"></div>';
  card.querySelector('.qtext').textContent = q.text;
  q.options.forEach((opt, k) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => pick(b, k, q);
    card.appendChild(b);
  });
}

function pick(btn, k, q) {
  const buttons = [...document.querySelectorAll('.opt')];
  buttons.forEach(b => b.disabled = true);
  picks.push(k);

  const right = q.answer;
  if (mode === 'train') {
    if (right >= 0) {
      buttons[right].classList.add('ok');
      buttons[right].insertAdjacentHTML('beforeend', '<span class="mark">✓</span>');
    }
    if (k === right) { correct++; el('status').textContent = 'Верно ✓'; }
    else {
      btn.classList.add('bad');
      btn.insertAdjacentHTML('beforeend', '<span class="mark">✗</span>');
      el('status').textContent = right >= 0 ? 'Неверно ✗' : 'Ответ не размечен';
    }
    el('score').textContent = 'Правильно: ' + correct;
  } else {
    // экзамен: без подсказок
    btn.classList.add('picked');
    el('status').textContent = 'Отвечено · далее…';
    if (k !== right) wrong.push({q, k});
  }

  el('next').disabled = false;
  clearTimeout(window.__adv);
  window.__adv = setTimeout(() => { if (!el('next').disabled) el('next').click(); }, 1000);
}

el('next').onclick = () => {
  clearTimeout(window.__adv);
  if (idx < queue.length - 1) { idx++; render(); }
  else { finish(); }
};

// кнопка «Список вопросов»
el('toggleJump').onclick = () => {
  const g = el('jumpgrid');
  g.style.display = (g.style.display === 'none') ? 'grid' : 'none';
};

// переход по номеру вопроса
el('goNum').onclick = () => {
  const n = parseInt(el('jumpNum').value, 10);
  if (!n) return;
  const k = queue.findIndex((q) => q.num === n);
  if (k >= 0) { goTo(k); el('jumpNum').value = ''; }
  else { el('status').textContent = 'Вопроса №' + n + ' нет в этом списке'; }
};
el('jumpNum').addEventListener('keydown', (e) => { if (e.key === 'Enter') el('goNum').click(); });

function finish() {  el('quiz').style.display = 'none';
  el('done').style.display = 'block';
  el('pbar').style.width = '100%';
  const total = queue.length;
  const rights = mode === 'exam' ? (total - wrong.length) : correct;
  el('finalScore').textContent = rights + ' / ' + total;
  el('finalPct').textContent = Math.round(rights / total * 100) + '% правильных · ' +
      (mode === 'exam' ? ('экзамен ' + queue.length + ' вопр.') : (lastSize === 'seq' ? 'тренировка по порядку' : 'тренировка вразброс'));

  const rev = el('review');
  rev.innerHTML = '';
  if (mode === 'exam' && wrong.length) {
    const h = document.createElement('h3');
    h.textContent = 'Ошибки (' + wrong.length + '):';
    rev.appendChild(h);
    wrong.forEach(({q, k}) => {
      const it = document.createElement('div');
      it.className = 'item';
      it.innerHTML = '<div class="q"></div><div class="a"></div><div class="b"></div>';
      it.querySelector('.q').textContent = '№ ' + q.num + '. ' + q.text;
      it.querySelector('.a').textContent = 'Ваш ответ: ' + (q.options[k] || '—');
      it.querySelector('.b').textContent = 'Правильно: ' + (q.answer >= 0 ? q.options[q.answer] : 'не размечено');
      rev.appendChild(it);
    });
  }
}

</script>
