<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f2742">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Мдк</title>
<style>
  :root{
    --accent:#4ade80;
    --bg1:#0b1023; --bg2:#141b38; --text:#e7ecf7; --muted:#9aa5c0;
    --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.12);
    --ok:#16a34a; --bad:#ef4444; --pick:#3b82f6;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1000px 600px at 15% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 60%),
      radial-gradient(800px 500px at 95% 110%, rgba(74,222,128,.10), transparent 60%),
      linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
    background-attachment:fixed;
    padding:28px 16px 60px;display:flex;flex-direction:column;align-items:center;
  }
  .wrap{width:100%;max-width:760px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
  .back{color:var(--muted);text-decoration:none;font-size:14px;border:1px solid var(--line);
        padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.04)}
  .back:hover{color:var(--text)}
  h1{font-size:clamp(22px,4vw,32px);letter-spacing:-.02em;margin-bottom:6px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:22px}
  .progress{height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-bottom:8px}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#4ade80);transition:width .25s}
  .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;
        backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .qnum{font-size:13px;color:var(--muted);margin-bottom:8px}
  .qtext{font-size:17px;line-height:1.45;margin-bottom:18px}
  .opt{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px 16px;border-radius:12px;
       border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);
       font-size:15px;line-height:1.35;cursor:pointer;transition:.15s;font-family:inherit}
  .opt:hover:not(:disabled){background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.25)}
  .opt:disabled{cursor:default}
  .opt.ok{background:rgba(22,163,74,.22);border-color:var(--ok)}
  .opt.bad{background:rgba(239,68,68,.18);border-color:var(--bad)}
  .opt.picked{background:rgba(59,130,246,.20);border-color:var(--pick)}
  .opt .mark{float:right;font-weight:700;margin-left:8px}
  .row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
  .btn{border:0;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;
       background:var(--accent);color:#0b1023;font-family:inherit}
  .btn.ghost{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--line)}
  .btn:disabled{opacity:.45;cursor:default}
  .hint{font-size:13px;color:var(--muted)}
  .menu .btn{display:block;width:100%;margin-bottom:12px;padding:16px 20px;text-align:left}
  .menu .btn small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:4px}
  .result{text-align:center}
  .result .score{font-size:44px;font-weight:800;margin:14px 0;color:var(--accent)}
  .result .pct{font-size:16px;color:var(--muted);margin-bottom:18px}
  .review{text-align:left;margin-top:18px}
  .review h3{font-size:15px;margin-bottom:10px;color:var(--muted)}
  .review .item{border-left:3px solid var(--bad);padding:8px 12px;margin-bottom:10px;background:rgba(239,68,68,.07);border-radius:0 10px 10px 0}
  .review .item .q{font-size:14px;margin-bottom:4px}
  .review .item .a{font-size:13px;color:#fca5a5}
  .review .item .b{font-size:13px;color:#86efac}
  .jumpbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .jumpbar input{width:120px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
                 background:rgba(255,255,255,.05);color:var(--text);font-family:inherit;font-size:14px}
  .jumpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;
            max-height:250px;overflow-y:auto;padding:10px;margin-bottom:12px;border-radius:14px;
            background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .jumpgrid button{padding:8px 0;border-radius:8px;border:1px solid var(--line);
                   background:rgba(255,255,255,.05);color:var(--text);font-size:12px;cursor:pointer;font-family:inherit}
  .jumpgrid button:hover{background:rgba(255,255,255,.12)}
  .jumpgrid button.cur{background:var(--accent);color:#0b1023;font-weight:700}
  .jumpgrid button.done{opacity:.5}
  @media(max-width:520px){
    body{padding:18px 10px 44px}
    h1{font-size:22px}
    .sub{font-size:13px;margin-bottom:14px}
    .card{padding:16px;border-radius:14px}
    .qtext{font-size:16px;line-height:1.4}
    .opt{font-size:14.5px;padding:13px 14px;margin-bottom:8px}
    .btn{padding:12px 16px;font-size:14px}
    .jumpbar{gap:6px}
    .jumpbar input{width:88px;font-size:14px}
    .jumpbar .hint{font-size:11px;flex-basis:100%}
    .jumpgrid{grid-template-columns:repeat(auto-fill,minmax(44px,1fr));max-height:200px}
    .meta{font-size:12px}
    .review .item .q{font-size:13.5px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← Все предметы</a>
    <span class="hint" id="counter"></span>
  </div>
  <h1>Мдк</h1>
  <div class="sub">Всего вопросов: <b>293</b></div>

  <div id="menu" class="card menu">
    <button class="btn" onclick="start('train')">🎯 Тренировка — все 293<small>Сразу видно правильный ответ, переход через 1 сек</small></button>
    <button class="btn ghost" onclick="start('exam')">📝 Экзамен — 20 случайных<small>Как на экзамене: результат и разбор ошибок в конце</small></button>
  </div>

  <div id="quiz" style="display:none">
    <div class="jumpbar">
      <button class="btn ghost" id="toggleJump">📋 Список вопросов</button>
      <input id="jumpNum" type="number" min="1" placeholder="№ вопроса">
      <button class="btn ghost" id="goNum">→</button>
      <span class="hint">можно перейти к любому вопросу</span>
    </div>
    <div class="jumpgrid" id="jumpgrid" style="display:none"></div>
    <div class="progress"><i id="pbar"></i></div>
    <div class="meta"><span id="qpos"></span><span id="score"></span></div>
    <div class="card" id="card"></div>
    <div class="row">
      <button class="btn" id="next" disabled>Далее →</button>
      <span class="hint" id="status"></span>
    </div>
  </div>

  <div id="done" style="display:none" class="card result">
    <h2>Результат</h2>
    <div class="score" id="finalScore">0</div>
    <div class="pct" id="finalPct"></div>
    <div class="review" id="review"></div>
    <div class="row" style="justify-content:center;margin-top:20px">
      <button class="btn" onclick="start(mode)">Ещё раз</button>
      <button class="btn ghost" onclick="toMenu()">К выбору режима</button>
    </div>
  </div>
</div>

er": 2}, {"num": 50, "text": "Количество этапов учебного процесса:", "options": ["5", "4", "3", "2"], "answer": 0}, {"num": 51, "text": "Третий этап учебного процесса:", "options": ["Оценка результатов обучения", "Оценка исходного уровня знаний", "Планирование обучения", "Реализация планов обучения"], "answer": 3}, {"num": 52, "text": "Качество и эффективность обучения позволяют определить этап учебного процесса:", "options": ["Пятый", "Четвёртый", "Третий", "Второй"], "answer": 0}, {"num": 53, "text": "Планирование содержания обучения – это этап учебного процесса:", "options": ["Четвертый", "Третий", "Второй", "Первый"], "answer": 2}, {"num": 54, "text": "Объективная информация о предметах, процессах и явлениях окружающего мира:", "options": ["Умение", "Навык", "Обучение", "Знание"], "answer": 3}, {"num": 55, "text": "Метод организации и практического осуществления мед – сестрой своей обязанности по обслуживанию пациента:", "options": ["Диагностика болезней", "Лечебный процесс", "Сестринский процесс", "Профилактика заболеваний"], "answer": 2}, {"num": 56, "text": "Второй этап сестринского процесса:", "options": ["Сестринское обследование", "Установление проблем пациента", "Планирование объёма сестринского вмешательства", "Определение проблем сестринского ухода"], "answer": 1}, {"num": 57, "text": "Субъективный метод сестринского обследования:", "options": ["Расспрос пациента", "Определение оттёков", "Измерение АД", "Осмотр пациента"], "answer": 0}, {"num": 58, "text": "Третий этап сестринского процесса:", "options": ["Обследование пациента", "Становление проблем пациента", "Выполнение сестринских вмешательств", "Составление плана ухода"], "answer": 3}, {"num": 59, "text": "Цель первого этапа сестринского процесса:", "options": ["Обследование пациента", "Составление плана ухода", "Выполнение сестринских вмешательств", "Оценка качеств сестринского ухода"], "answer": 0}, {"num": 60, "text": "Оценка состояния пациента – этап сестринского процесса:", "options": ["Первый", "Второй", "Третий", "Четвёртый"], "answer": 0}, {"num": 61, "text": "Определение потребностей пациента сестра определяет в период:", "options": ["Обследования пациента", "Постановки целей ухода", "Определение объёма сестринских вмешательств", "Реализация плана сестринских вмешательств"], "answer": 0}, {"num": 62, "text": "Беседа с пациентом – метод обследования:", "options": ["Объективный", "Субъективный", "Дополнительный", "Клинический"], "answer": 1}, {"num": 63, "text": "Измерение роста и массы тела – метод обследования:", "options": ["Субъективный", "Объективный", "Дополнительный", "Клинический"], "answer": 1}, {"num": 64, "text": "Исследование ЧДД, пульса, АД – метод обследование пациента:", "options": ["Дополнительный", "Объективный", "Клинический", "Субъективный"], "answer": 1}, {"num": 65, "text": "Физиологические отправления оценивают состояние пациента:", "options": ["Эмоциональное", "Психологическое", "Социальное", "Физическое"], "answer": 3}, {"num": 66, "text": "Антропометрическое исследования включает определение:", "options": ["Массу тела", "Температуру", "Пульс", "АД"], "answer": 0}, {"num": 67, "text": "Повышение АД – это:", "options": ["Гипотензия", "Гипертензия", "Тахикардия", "Брадикардия"], "answer": 1}, {"num": 68, "text": "Тахипноэ – это:", "options": ["Урежение пульса", "Урежение дыхания", "Учащение пульса", "Учащение дыхания"], "answer": 3}, {"num": 69, "text": "Учащение пульса:", "options": ["Тахипноэ", "Брадипноэ", "Тахикардия", "Брадикардия"], "answer": 2}, {"num": 70, "text": "Приоритетная физиологическая проблема пациента:", "options": ["Боль", "Беспокойство", "Слабость", "Отсутствие аппетита"], "answer": 0}, {"num": 71, "text": "Неудовлетворённые проблемы пациента:", "options": ["Желания", "Способности", "Возможности", "Потребности"], "answer": 3}, {"num": 72, "text": "Документирование этапов сестринского процесса осуществляют в:", "options": ["Медицинской карте наблюдения за пациентом", "Амбулаторной карте", "Листе назначений", "Сестринской истории назначения"], "answer": 0}, {"num": 73, "text": "Выполнение сестринских вмешательств – этап Сестринского процесса:", "options": ["Первый", "Второй", "Третий", "Четвёртый"], "answer": 3}, {"num": 74, "text": "Социальная проблема пациента:", "options": ["Конфликт в семье", "Недержание мочи", "Страх операции", "Нарушение сна"], "answer": 0}, {"num": 75, "text": "Потенциальная физиологическая проблема пациента:", "options": ["Риск появления опрелостей", "Недержание мочи", "Риск суицидальной попытки", "Нарушение сна"], "answer": 0}, {"num": 76, "text": "Физиологическая проблема пациента:", "options": ["Нарушение сна", "Невозможность посещать церковь", "Боязнь потери работы", "Материальные трудности"], "answer": 0}, {"num": 77, "text": "Основоположницей сестринского дела является:", "options": ["Х. Оппель", "Ф. Найтингейл", "Е. Бакунина", "Гиппократ"], "answer": 1}, {"num": 78, "text": "Наука о должном поведении медицинской сестры – это:", "options": ["Этика", "Эргономика.", "Деонтология", "Биомеханика"], "answer": 2}, {"num": 79, "text": "Выполнение правила конфиденциальности предполагает:", "options": ["Передача информации родственникам, после согласия пациента", "Сведение к минимуму исходящего от медицинского работника вреда", "Передача информации родственникам", "Передача информации нотариусу"], "answer": 0}, {"num": 80, "text": "Процесс передачи информации между медсестрой и пациентом, называется:", "options": ["Перцепция", "Разговор", "Коммуникация", "Обратная связь"], "answer": 2}, {"num": 81, "text": "Невербальная информация передается с помощью:", "options": ["Через сторонних лиц", "С помощью речи", "Взаимного расположения, жестов, визуального контакта", "При разговоре"], "answer": 2}, {"num": 82, "text": "Кто не может быть в роли обучаемых медицинских сестер:", "options": ["Врачи", "Заведующий отделением", "Пациент и его родственники", "Младший медицинский персонал"], "answer": 0}, {"num": 83, "text": "Состояние нужды организма в том, что определяет его нормальную жизнедеятельность, называется:", "options": ["Потребность", "Самоактуализация", "Желание", "Принцип"], "answer": 0}, {"num": 84, "text": "К первому уровню в пирамиде по А. Маслоу относятся:", "options": ["Потребности в достижении успеха", "Потребность в самоактуализации", "Физиологические потребности", "Социальные потребности"], "answer": 2}, {"num": 85, "text": "Первый этап сестринского процесса – это:", "options": ["Планирование помощи, которая нацелена на удовлетворение потребностей пациента", "Осуществление плана сестринских вмешательств", "Постановка целей", "Обследование пациента"], "answer": 3}, {"num": 86, "text": "Источниками субъективной информации о пациенте являются:", "options": ["Пациент, участники медицинской бригады", "Пациент, родственники", "Пациент, участники приемного отделения", "Медицинская литература"], "answer": 1}, {"num": 87, "text": "Период, за который должна быть выполнена краткосрочная цель:", "options": ["До 2 недель", "2-4 недели", "4-6 недель", "6-8 недель"], "answer": 0}, {"num": 88, "text": "Сестринские вмешательства не могут включать:", "options": ["Советы", "Оценку действий", "Назначение препаратов", "Обучение навыкам"], "answer": 2}, {"num": 89, "text": "В норму у взрослого человека пульс составляет:", "options": ["60-70", "60-80", "60-90", "58-78"], "answer": 1}, {"num": 90, "text": "В норме у здорового человека систолическое давление составляет:", "options": ["110-139", "110-129", "100-130", "90-120"], "answer": 0}, {"num": 91, "text": "В норме у здорого человека диастолическое давление составляет:", "options": ["60-80", "60-89", "60-99", "60-100"], "answer": 1}, {"num": 92, "text": "Проведение гигиенического туалета, кормление, смена нательного и постельного белья относятся к элементам:", "options": ["Лечении больного", "Профилактики инфекционных заболеваний", "Элементам ухода за больным", "Лечения больных"], "answer": 2}, {"num": 93, "text": "В норме у здорового человека ЧДД составляет:", "options": ["16-18", "16-20", "14-16-18", "19-22"], "answer": 1}, {"num": 94, "text": "Сколько этапов в сестринском процессе:", "options": ["3", "4", "5", "6"], "answer": 2}, {"num": 95, "text": "Потенциальные проблемы пациента – это:", "options": ["Осложнения", "Рецидивы заболевания", "Связанные с опасностью для жизни", "Вспомогательные"], "answer": 0}, {"num": 97, "text": "Виды патологического дыхания:", "options": ["Брадипноэ", "Тахипноэ", "Чейна-Стокса", "Глубокое"], "answer": 2}, {"num": 98, "text": "Урежение пульса ниже 60 уд. в 1 мин:", "options": ["Брадикардия", "Тахикардия", "Дискардия", "Тахикардия"], "answer": 0}, {"num": 99, "text": "Основные характеристики пульса: частота, напряжение, наполнение:", "options": ["Ритмичность", "Симметричность", "Скорость", "Подвижность"], "answer": 0}, {"num": 100, "text": "Стул подобран правильно, если на сиденье находится:", "options": ["2/3 длины бедер;", "1/2 длины бедер;", "1/3 длины бедер;", "Все бедро"], "answer": 0}, {"num": 101, "text": "Для удержания пациента в положении «на боку» используется:", "options": ["Специальное приспособление функциональной кровати;", "Положение не предусматривает какой-либо поддержки;", "Стена;", "Подушечка, подложенная под спину."], "answer": 3}, {"num": 102, "text": "Для того чтобы повернуться в положении стоя, необходимо: 1. Сначала повернуть голову и плечи, затем развернуться в поясничном отделе, и только после этого развернуть стопы;", "options": ["Начать поворот с поясницы;", "Повернуть ступни так, чтобы за ними следовал весь корпус;", "Повернуться произвольно."], "answer": 0}, {"num": 103, "text": "Предупреждает длительное давление матраца на пятки в положении Фаулера или «на спине»:", "options": ["Упор для стоп;", "Небольшая подушечка или валик под пятки;", "Небольшая подушечка или валик под нижнюю треть голени;", "Давление на пятки в таких положениях вообще не происходит."], "answer": 2}, {"num": 104, "text": "Расположение стоп при поднятии тяжести:", "options": ["Вместе, параллельно;", "На ширину плеч, выдвинув одну стопу слегка вперед;", "Параллельно ширине плеч;", "Расположение стоп не имеет значения."], "answer": 1}, {"num": 105, "text": "В положении пациента «на животе» стопы:", "options": ["Упираются в упор для стоп;", "Свободно располагаются на постели;", "Одна конечность упирается в упор для стоп, другая - лежит на подушечке;", "Лежат на подушечках."], "answer": 1}, {"num": 106, "text": "Положение Фаулера это -:", "options": ["Полулежа, полусидя;", "На боку;", "На животе;", "На спине."], "answer": 0}, {"num": 108, "text": "При поднятии груза положение будет более устойчивым, если стопы расположить на расстоянии (в см.):", "options": ["10;", "20;", "30;", "40."], "answer": 2}, {"num": 110, "text": "Профилактика сгибательной контрактуры шейных мышц в положении Фаулера или «на спине» обеспечивается:", "options": ["Поднятием изголовья кровати под утлом 45 - 60°;", "Подкладыванием небольшой подушечки под верхнюю часть плеч, шею и голову;", "Использованием упора для стоп;", "Подкладыванием валика под поясничную область."], "answer": 1}, {"num": 111, "text": "Использование упора для стоп обеспечивает: 1. Правильное тыльное сгибание стоп и предотвращение «провисания стоп»;", "options": ["Предотвращение переразгибания нижних конечностей;", "Предотвращение поворота бедра внутрь;", "Профилактику пролежней."], "answer": 0}, {"num": 112, "text": "В каком положении пациента в кровати не используется упор для стоп:", "options": ["Фаулера;", "Симса;", "На боку;", "На животе."], "answer": 3}, {"num": 113, "text": "В положении Фаулера головной конец кровати приподнят на:", "options": ["30 - 40°;", "45 - 60°;", "70 - 90°;", "Горизонтальное положение."], "answer": 1}, {"num": 114, "text": "Положение Симса – это:", "options": ["Промежуточное положение между положением лежа на животе и лежа на боку;", "Лежа на животе;", "Лежа на спине;", "Полулежа или полусидя."], "answer": 0}, {"num": 115, "text": "Исключите неправильное утверждение: правильная биомеханика в положении сидя заключается в следующем:", "options": ["Колени чуть выше бедер;", "Колени должны быть расслаблены так, чтобы коленные суставы двигались свободно;", "Спина должна быть прямой, а мышцы живота напряжены;", "Плечи должны быть расправлены и расположены симметрично бедрам."], "answer": 0}, {"num": 116, "text": "Правильная биомеханика тела медсестры обеспечивает:", "options": ["Транспортировку, перемещение и изменение положения тела пациента;", "Предотвращение травмы позвоночника медсестры в процессе работы;", "Своевременное выполнение врачебных назначений;", "Положение, позволяющее удерживать равновесие."], "answer": 1}, {"num": 117, "text": "Лихорадка - это повышение температуры тела выше:", "options": ["36,0 С;", "37,0 С;", "38,0°С;", "39,0°С."], "answer": 1}, {"num": 118, "text": "Причиной лихорадки является нарушение процесса:", "options": ["Кровообращения;", "Терморегуляции;", "Дыхания;", "Потоотделения."], "answer": 1}, {"num": 119, "text": "Терморегуляция  это процесс, в результате которого:", "options": ["Регулируется образование и выделение тепла;", "Регулируется выделение тепла;", "Регулируется образование тепла;", "Поглощается тепло организмом."], "answer": 0}, {"num": 120, "text": "Температуру в подмышечной впадине измеряют:", "options": ["5 мин;", "10 мин;", "20 мин;", "40 мин."], "answer": 1}, {"num": 121, "text": "Субфебрильной называется температура тела:", "options": ["37,0-38,0 С;", "35,0-36,0 С;", "36,0-37,0 С;", "Выше 38,0 °С."], "answer": 0}, {"num": 122, "text": "Нормальная температура тела в прямой кишке:", "options": ["37,8 С;", "37,0 °С;", "36,6 °С;", "35,5 С."], "answer": 0}, {"num": 123, "text": "Извращенная лихорадка  это:", "options": ["С суточным колебанием температуры более 1,0 °С;", "Утренняя температура максимальная, вечерняя нормальная;", "Колебания температуры в пределах 0,5-1,0 °С;", "Утренняя температура нормальная, вечерняя максимальная."], "answer": 1}, {"num": 124, "text": "Умеренная лихорадка (°С):", "options": ["Температура тела не выше 38 °С;", "Выше 41,0 °С;", "38,0-39,0 С;", "39-40,0 С."], "answer": 2}, {"num": 125, "text": "Термометры после использования дезинфицируются методом:", "options": ["Протирания;", "Полного погружения;", "УФО-облучения;", "Орошения."], "answer": 1}, {"num": 126, "text": "Температурная кривая регистрируется:", "options": ["В температурном листе;", "В дневнике истории болезни;", "В журнале поступления больных;", "В листе назначений."], "answer": 0}, {"num": 127, "text": "Тип лихорадки, при которой периоды постоянного повышения температуры (на 3-50 С) сменяются периодами понижения до субнормальной или нормальной:", "options": ["Послабляющая;", "Перемежающая;", "Волнообразная;", "Гектическая."], "answer": 2}, {"num": 128, "text": "Тип лихорадки, при которой утренняя температура выше вечерней:", "options": ["Послабляющая;", "Перемежающая;", "Волнообразная;", "Извращенная."], "answer": 3}, {"num": 129, "text": "Температура тела, измеряемая на слизистых оболочках (°С):", "options": ["39-41;", "38-39;", "37-38;", "36-37."], "answer": 2}, {"num": 130, "text": "Температура тела в течение дня колеблется в пределах (°С):", "options": ["1-1,5;", "0,8-1;", "0,3-0,8;", "0,1-0,3."], "answer": 2}, {"num": 131, "text": "В развитии лихорадки различают периоды:", "options": ["Четыре;", "Три;", "Два;", "Один."], "answer": 1}, {"num": 132, "text": "Учащение пульса в 1 мин при повышении температуры тела на 1С (в ударах) у взрослых:", "options": ["20;", "10;", "5;", "2."], "answer": 1}, {"num": 133, "text": "У лихорадящего больного может возникнуть резкая слабость, обильный холодный пот, бледность кожных покровов, даже нитевидный пульс и снижение АД. Это наиболее вероятно при:", "options": ["Быстром повышении температуры;", "Литическом снижении высокой температуры;", "Критическом снижении температуры;", "Субфебрилитете."], "answer": 2}, {"num": 134, "text": "Субфебрильная температура тела (°С):", "options": ["39-39,5;", "38,5-38,9;", "38,1-38,2;", "37,1-38."], "answer": 3}, {"num": 135, "text": "В первом периоде лихорадки возможно применение:", "options": ["Влажного обертывания;", "Грелки;", "Холодного компресса;", "Пузыря со льдом."], "answer": 1}, {"num": 136, "text": "Физиологическая температура тела пациента чаще бывает ниже:", "options": ["Утром;", "В обед;", "Вечером;", "Ночью."], "answer": 0}, {"num": 137, "text": "Основной признак первого периода лихорадки:", "options": ["Озноб;", "Чувство жара;", "Учащение пульса;", "Рвота."], "answer": 0}, {"num": 138, "text": "Протирание подмышечной впадины перед измерением температуры тела:", "options": ["Необходимо с гигиенической целью;", "Проводят для получения правильных результатов термометрии;", "Необязательно;", "Не оказывает влияния на показания термометра."], "answer": 1}, {"num": 139, "text": "В первом периоде лихорадки у пациента наблюдаются:", "options": ["Недомогание, ломота во всем теле, головная боль, озноб;", "Слабость, чувство жара, усиленное потоотделение, гиперемия кожи;", "Внезапная слабость, холодный липкий пот, снижение АД, нитевидный пульс;", "Бред, головная боль, сухость во рту, снижение аппетита."], "answer": 0}, {"num": 140, "text": "Во втором периоде лихорадки у пациента наблюдаются:", "options": ["Недомогание, ломота во всем теле, головная боль, озноб;", "Слабость, чувство жара, усиленное потоотделение, гиперемия кожи;", "Внезапная слабость, холодный липкий пот, снижение АД, нитевидный пульс;", "Бред, головная боль, сухость во рту, снижение аппетита."], "answer": 1}, {"num": 141, "text": "В третьем периоде лихорадки, при кризисе, у пациента наблюдаются:", "options": ["Недомогание, ломота во всем теле, головная боль, озноб;", "Слабость, чувство жара, усиленное потоотделение, гиперемия кожи;", "Внезапная слабость, холодный липкий пот, снижение АД, нитевидный пульс;", "Бред, головная боль, сухость во рту, снижение аппетита."], "answer": 2}, {"num": 142, "text": "Пульс  это колебание стенки артерий, создающееся:", "options": ["Систолической волной крови;", "Диастолической волной крови;", "Правильным чередованием сильных пульсовых волн с паузами", "Давлении крови на стенки артерий"], "answer": 0}, {"num": 143, "text": "Число сердечных сокращений у взрослого человека в норме:", "options": ["85-90 ударов в мин;", "60-80 ударов в мин;", "40-50 ударов в мин.", "100-110"], "answer": 1}, {"num": 144, "text": "Частота пульса:", "options": ["Зависит от возраста, заболеваний крови;", "Не зависит от возраста;", "Зависит от возраста и заболеваний сердечно-сосудистой системы.", "Зависит от заболеваний кожи"], "answer": 2}, {"num": 145, "text": "При аритмичном пульсе подсчет производят в течение:", "options": ["20 сек, умножая на 6;", "30 сек, умножая на 3;", "1 мин.", "2 мин."], "answer": 2}, {"num": 146, "text": "Урежение пульса называется:", "options": ["Брадикардией;", "Тахикардией;", "Асистолией.", "Тахипноэ"], "answer": 0}, {"num": 147, "text": "Учащение пульса называется:", "options": ["Брадикардией;", "Тахикардией;", "Асистолией.", "Тахипноэ"], "answer": 1}, {"num": 148, "text": "Отсутствие пульса называется:", "options": ["Тахикардией;", "Брадикардией;", "Асистолией.", "Апноэ"], "answer": 2}, {"num": 149, "text": "Появление внеочередной пульсовой волны меньшей величины называется:", "options": ["Экстрасистолией;", "Брадикардией;", "Дефицитом пульса.", "Дефицитом дыхания"], "answer": 0}, {"num": 150, "text": "Разница между количеством систол и пульсовых волн называется:", "options": ["Экстрасистолией;", "Брадикардией;", "Дефицитом пульса.", "Дефицитом дыхания"], "answer": 2}, {"num": 151, "text": "Нормальными цифрами систолического давления являются:", "options": ["60-70 мм рт. ст.;", "75-85 мм рт. ст.;", "100-135 мм рт. ст.;", "145-160 мм рт. ст."], "answer": 2}, {"num": 152, "text": "По механизму возникновения различают следующие виды одышки:", "options": ["Экспираторная;", "Приступообразная;", "Постоянная;", "Поверхностная."], "answer": 0}, {"num": 153, "text": "Для диеты № 10 по Певзнеру характерно:", "options": ["Ограничение углеводов;", "Ограничение жидкости, белков;", "Ограничение соли, жидкости;", "Ограничение жиров, соли, продуктов, богатых холестерином."], "answer": 2}, {"num": 154, "text": "При заболеваниях желудка назначается диета №:", "options": ["1;", "5;", "7;", "9."], "answer": 0}, {"num": 155, "text": "При запорах назначают диету №:", "options": ["10;", "3;", "7;", "5."], "answer": 1}, {"num": 156, "text": "Соотношение белков, жиров и углеводов в пищевом рационе больных:", "options": ["Преобладают белки;", "Преобладают углеводы;", "1:1:4;", "2:2:2."], "answer": 2}, {"num": 157, "text": "При заболеваниях сердечно-сосудистой системы назначается диета №:", "options": ["1;", "10;", "5;", "7."], "answer": 1}, {"num": 158, "text": "Порционное требование на пищеблок составляется:", "options": ["Четыре раза в день;", "Один раз в неделю;", "Один раз в день;", "При поступлении пациента в стационар."], "answer": 2}, {"num": 159, "text": "При заболеваниях, не требующих назначения специальной диеты, рекомендуется диета №:", "options": ["10;", "11;", "13;", "15."], "answer": 3}, {"num": 160, "text": "Опрелостям способствуют:", "options": ["Тепло", "Сухость", "Тучность", "Потливость"], "answer": 3}, {"num": 161, "text": "Температурные раздражители рефлекторно влияют на:", "options": ["Снижение свертываемости крови;", "Широту просвета кровеносных сосудов, чувствительность организма, тонус мышц;", "Гладкую мускулатуру внутренних органов, ЦНС, оказывая успокаивающий эффект;", "Функцию кишечника."], "answer": 1}, {"num": 162, "text": "Показания к применению банок:", "options": ["Застойные явления в легких;", "Легочные кровотечения;", "Боли в области почек;", "Невралгии, миозиты."], "answer": 0}, {"num": 163, "text": "Противопоказания к применению банок:", "options": ["Туберкулез легких, лихорадка; легочные и другие кровотечения;", "Радикулит", "Невралгии, миозиты.", "Воспаление дыхательных путей"], "answer": 0}, {"num": 164, "text": "Места постановки банок: 1. Подлопаточная и межлопаточная область, исключая позвоночник, передняя поверхность грудной клетки, исключая молочные железы и область сердца.", "options": ["По ходу позвоночника при остеохондрозе;", "Область почек;", "Область сердце"], "answer": 0}, {"num": 165, "text": "Экспозиция банок на теле пациента:", "options": ["10-20 мин, в количестве 10-20 штук;", "5-7 мин, в количестве 5-7 штук;", "30 мин, в количестве 4-5 штук;", "Устанавливают индивидуально, по назначению врача."], "answer": 0}, {"num": 167, "text": "Показания к постановке влажного согревающего компресса:", "options": ["Инфильтрат после инъекций; боли в суставах;", "Боли в животе;", "Лихорадка.", "Кровотечение"], "answer": 0}, {"num": 168, "text": "Противопоказания к постановке влажного согревающего компресса:", "options": ["Инфильтраты;", "Боли в суставах;", "Заболевания кожи, лихорадка (2-й период); боли в животе.", "Отит"], "answer": 2}, {"num": 169, "text": "Смену влажного холодного компресса производят через:", "options": ["2-3 мин; по мере нагревания.", "Как только он высохнет;", "Через 10-20 мин, с промежутком 5 мин;", "15-30 мин."], "answer": 0}, {"num": 170, "text": "Правильность наложения влажного согревающего компресса проверяют:", "options": ["Через 1-2 часа, просунув палец под компресс, определив его состояние;", "Через 1-2 часа, сняв компресс, определив по состоянию кожи;", "Через 1-2 часа, опросив больного о состоянии компресса и субъективных ощущениях;", "Через 10 мин, просунув палец под компресс, определив его состояние."], "answer": 0}, {"num": 171, "text": "Показания к применению горчичников:", "options": ["Туберкулез легких;", "Заболевания кожи;", "Миозиты, невралгии, радикулиты; воспалительные заболевания дыхательных путей.", "Кровотечение"], "answer": 2}, {"num": 172, "text": "Ожоги на коже после снятия банок, горчичников обрабатывают:", "options": ["Хлоргексидином;", "5% раствором перманганата калия;", "Накладывают мазевую повязку.", "5 % йодом"], "answer": 1}, {"num": 173, "text": "Показания к применению пузыря со льдом:", "options": ["Боли в области печени, почек;", "Сильные головные боли;", "Внутренние кровотечения; ушибы в первые сутки.", "Лихорадка 1 период"], "answer": 2}, {"num": 174, "text": "Показания к применению грелки:", "options": ["Абсцессы после инъекций;", "Внутренние кровотечения;", "Озноб; инфильтраты после инъекций.", "Лихорадка 2 период"], "answer": 2}, {"num": 175, "text": "Противопоказания к применению грелки:", "options": ["Абсцессы; острые боли в животе;", "Ознобы;", "Ушибы вторые сутки.", "Хронические боли"], "answer": 0}, {"num": 176, "text": "Гирудотерапия  это применение пиявок с целью:", "options": ["Кровоизвлечения; снижения свертываемости крови.", "Болеутоляющего действия;", "Рассасывание воспалительных инфильтратов;", "Удаление некротизированной ткани"], "answer": 0}, {"num": 177, "text": "Индифферентная температура (в °С):", "options": ["14-16;", "18-20;", "34-35;", "40-45."], "answer": 2}, {"num": 178, "text": "Местный полуспиртовый компресс следует снять через (в часах):", "options": ["10-12;", "4-6;", "2-3;", "1-2."], "answer": 1}, {"num": 179, "text": "При ушибе в качестве первой помощи применяют:", "options": ["Согревающий компресс;", "Пузырь со льдом;", "Горячий компресс;", "Грелку."], "answer": 1}, {"num": 180, "text": "Количество слоев салфетки для согревающего компресса:", "options": ["8;", "5;", "4;", "2."], "answer": 2}, {"num": 181, "text": "Температура воды, используемая для смачивания горчичников (° С):", "options": ["60;", "40;", "34;", "20."], "answer": 1}, {"num": 182, "text": "Салфетку для влажного согревающего компресса нужно смочить в воде, после чего отжать (° С):", "options": ["Холодной (12);", "Теплой (37);", "Комнатной (20-22);", "Горячей (60)."], "answer": 2}, {"num": 183, "text": "Показанием к применению кислорода является:", "options": ["Гипоксия тканей;", "Боли в области сердца;", "Отеки;", "Нарушение зрения."], "answer": 0}, {"num": 184, "text": "При проведении оксигенотерапии кислород увлажняют с целью:", {"num": 193, "text": "Факторы, приводящие к учащению сокращений сердца, могут вызвать:", "options": ["Увеличение глубины и учащение дыхания", "Урежение дыхания", "Повышение температуры", "Слабость"], "answer": 0}, {"num": 194, "text": "Введение через прямую кишку различных жидкостей с диагностической или лечебной целью называется:", "options": ["Газоотводной трубкой", "Клизмой", "Ирригоскопией", "Ректороманоскопией"], "answer": 1}, {"num": 195, "text": "Газоотводная трубка вводится в прямую кишку на глубину:", "options": ["10-15 см", "15-20 см", "20-30 см", "40-50 см"], "answer": 2}, {"num": 196, "text": "Опрелости могут развиваться:", "options": ["На затылке", "На лопатках", "В паховых складках", "На локтях"], "answer": 2}, {"num": 197, "text": "Санпропускник служит для:", "options": ["Оказания экстренной помощи", "Регистрации пациентов", "Санитарной обработки пациентов", "Для приготовления дезинфицирующих растворов"], "answer": 2}, {"num": 198, "text": "О пациентах, доставленных с улицы в бессознательном состоянии, медицинская сестра приемного отделения дает телефонограмму:", "options": ["В полицию", "В санэпидемстанцию", "В отдел здравоохранения", "В службу спасения"], "answer": 0}, {"num": 199, "text": "Показанием для применения пузыря со льдом является:", "options": ["Первые сутки после ушиба", "Вторые сутки после ушиба", "Первый период лихорадки", "Отит"], "answer": 0}, {"num": 200, "text": "Преимуществом использования лицевой маски при оксигенотерапии является:", "options": ["Ощущение жара, давление на область носа, ушей", "Возможность экстренной оксигенотерапии", "Возможность общения", "Возможность есть, пить, принимать лекарственные средства"], "answer": 1}, {"num": 201, "text": "Частота дыхательных движений в одну минуту у взрослого человека в норме составляет:", "options": ["10-12", "16-20", "22-28", "30-36"], "answer": 1}, {"num": 202, "text": "Пролежни у тяжелобольных пациентов при положении на спине могут образоваться в области:", "options": ["Тазобедренного сустава", "Коленных суставов", "Подколенной ямки", "Крестца"], "answer": 3}, {"num": 203, "text": "Наиболее предпочтительным местом исследования артериального пульса является:", "options": ["Сонная артерия", "Почечная артерия", "Аорта", "Печеночная артерия"], "answer": 0}, {"num": 204, "text": "Разность между максимальным и минимальным давлением называется:", "options": ["Диастолическим", "Систолическим", "Пульсовым", "Дефицитным"], "answer": 2}, {"num": 205, "text": "У большинства женщин отмечается физиологический тип дыхания:", "options": ["Брюшной", "Смешанный", "Грудной", "Глубокий"], "answer": 2}, {"num": 206, "text": "Одышка с характерным шумным вдохом называется:", "options": ["Инспираторной", "Поверхностной", "Экспираторной", "Смешанной"], "answer": 0}, {"num": 207, "text": "Для измерения артериального давления необходимы:", "options": ["Термометр и линейка", "Тонометр и фонендоскоп", "Тонометр и секундомер", "Термометр и фонендоскоп"], "answer": 1}, {"num": 208, "text": "Артериальное давление чаще всего измеряется на:", "options": ["Печеночной артерии", "Сонной артерии", "Бедренной артерии", "Плечевой артерии"], "answer": 3}, {"num": 209, "text": "При измерении артериального давления манжету:", "options": ["Накладывают на одежду", "Накладывают на локтевую область", "Не накладывают", "Накладывают на кожу"], "answer": 3}, {"num": 210, "text": "При измерении артериального давления манжета накладывается:", "options": ["На верхнюю треть плеча", "На среднюю треть плеча", "На нижнюю треть плеча", "На локтевой сгиб"], "answer": 2}, {"num": 211, "text": "Целью помощи пациенту в осуществлении личной гигиены является:", "options": ["Профилактика ВБИ", "Обеспечение комфорта, чистоты, безопасности пациента", "Предупреждение развития хронических заболеваний", "Обеспечение лечебно-охранительного режима"], "answer": 1}, {"num": 212, "text": "Показанием к применению грелки является:", "options": ["Острый аппендицит", "Инсульт", "Кровотечение", "Переохлаждение"], "ans const ALL = DATA.questions;
const EXAM_SIZE = 20;
let mode = 'train', queue = [], idx = 0, correct = 0, wrong = [], picks = [];

const el = (id) => document.getElementById(id);

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function toMenu() {
  el('menu').style.display = 'block';
  el('quiz').style.display = 'none';
  el('done').style.display = 'none';
}

// ── переход к любому вопросу ──
function buildJump() {
  const g = el('jumpgrid');
  g.innerHTML = '';
  queue.forEach((q, k) => {
    const b = document.createElement('button');
    b.textContent = q.num;
    b.dataset.k = k;
    b.onclick = () => goTo(k);
    g.appendChild(b);
  });
  markJump();
}

function markJump() {
  const g = el('jumpgrid');
  if (!g) return;
  [...g.children].forEach((b) => b.classList.toggle('cur', Number(b.dataset.k) === idx));
}

function goTo(k) {
  if (k < 0 || k >= queue.length) return;
  clearTimeout(window.__adv);
  idx = k;
  render();
}

function start(m) {
  mode = m;
  clearTimeout(window.__adv);
  queue = (m === 'exam') ? shuffle(ALL).slice(0, Math.min(EXAM_SIZE, ALL.length)) : shuffle(ALL);
  idx = 0; correct = 0; wrong = []; picks = [];
  el('menu').style.display = 'none';
  el('done').style.display = 'none';
  el('quiz').style.display = 'block';
  buildJump();
  render();
}

function render() {
  const q = queue[idx];
  el('qpos').textContent = 'Вопрос ' + (idx + 1) + ' из ' + queue.length;
  el('score').textContent = mode === 'exam' ? 'Отвечено: ' + picks.length : 'Правильно: ' + correct;
  el('pbar').style.width = (idx / queue.length * 100) + '%';
  el('next').disabled = true;
  el('status').textContent = '';
  markJump();
  const card = el('card');
  card.innerHTML = '<div class="qnum">№ ' + q.num + '</div><div class="qtext"></div>';
  card.querySelector('.qtext').textContent = q.text;
  q.options.forEach((opt, k) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => pick(b, k, q);
    card.appendChild(b);
  });
}

function pick(btn, k, q) {
  const buttons = [...document.querySelectorAll('.opt')];
  buttons.forEach(b => b.disabled = true);
  picks.push(k);

  const right = q.answer;
  if (mode === 'train') {
    if (right >= 0) {
      buttons[right].classList.add('ok');
      buttons[right].insertAdjacentHTML('beforeend', '<span class="mark">✓</span>');
    }
    if (k === right) { correct++; el('status').textContent = 'Верно ✓'; }
    else {
      btn.classList.add('bad');
      btn.insertAdjacentHTML('beforeend', '<span class="mark">✗</span>');
      el('status').textContent = right >= 0 ? 'Неверно ✗' : 'Ответ не размечен';
    }
    el('score').textContent = 'Правильно: ' + correct;
  } else {
    // экзамен: без подсказок
    btn.classList.add('picked');
    el('status').textContent = 'Отвечено · далее…';
    if (k !== right) wrong.push({q, k});
  }

  el('next').disabled = false;
  clearTimeout(window.__adv);
  window.__adv = setTimeout(() => { if (!el('next').disabled) el('next').click(); }, 1000);
}

el('next').onclick = () => {
  clearTimeout(window.__adv);
  if (idx < queue.length - 1) { idx++; render(); }
  else { finish(); }
};

// кнопка «Список вопросов»
el('toggleJump').onclick = () => {
  const g = el('jumpgrid');
  g.style.display = (g.style.display === 'none') ? 'grid' : 'none';
};

// переход по номеру вопроса
el('goNum').onclick = () => {
  const n = parseInt(el('jumpNum').value, 10);
  if (!n) return;
  const k = queue.findIndex((q) => q.num === n);
  if (k >= 0) { goTo(k); el('jumpNum').value = ''; }
  else { el('status').textContent = 'Вопроса №' + n + ' нет в этом списке'; }
};
el('jumpNum').addEventListener('keydown', (e) => { if (e.key === 'Enter') el('goNum').click(); });

function finish() {  el('quiz').style.display = 'none';
  el('done').style.display = 'block';
  el('pbar').style.width = '100%';
  const total = queue.length;
  const rights = mode === 'exam' ? (total - wrong.length) : correct;
  el('finalScore').textContent = rights + ' / ' + total;
  el('finalPct').textContent = Math.round(rights / total * 100) + '% правильных' +
      (mode === 'exam' ? ' · экзамен' : ' · тренировка');

  const rev = el('review');
  rev.innerHTML = '';
  if (mode === 'exam' && wrong.length) {
    const h = document.createElement('h3');
    h.textContent = 'Ошибки (' + wrong.length + '):';
    rev.appendChild(h);
    wrong.forEach(({q, k}) => {
      const it = document.createElement('div');
      it.className = 'item';
      it.innerHTML = '<div class="q"></div><div class="a"></div><div class="b"></div>';
      it.querySelector('.q').textContent = '№ ' + q.num + '. ' + q.text;
      it.querySelector('.a').textContent = 'Ваш ответ: ' + (q.options[k] || '—');
      it.querySelector('.b').textContent = 'Правильно: ' + (q.answer >= 0 ? q.options[q.answer] : 'не размечено');
      rev.appendChild(it);
    });
  }
}

</script>
</body>
