<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f2742">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Латинский</title>
<style>
  :root{
    --accent:#c084fc;
    --bg1:#0b1023; --bg2:#141b38; --text:#e7ecf7; --muted:#9aa5c0;
    --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.12);
    --ok:#16a34a; --bad:#ef4444; --pick:#3b82f6;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1000px 600px at 15% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 60%),
      radial-gradient(800px 500px at 95% 110%, rgba(74,222,128,.10), transparent 60%),
      linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
    background-attachment:fixed;
    padding:28px 16px 60px;display:flex;flex-direction:column;align-items:center;
  }
  .wrap{width:100%;max-width:760px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
  .back{color:var(--muted);text-decoration:none;font-size:14px;border:1px solid var(--line);
        padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.04)}
  .back:hover{color:var(--text)}
  h1{font-size:clamp(22px,4vw,32px);letter-spacing:-.02em;margin-bottom:6px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:22px}
  .progress{height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-bottom:8px}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#4ade80);transition:width .25s}
  .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;
        backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .qnum{font-size:13px;color:var(--muted);margin-bottom:8px}
  .qtext{font-size:17px;line-height:1.45;margin-bottom:18px}
  .opt{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px 16px;border-radius:12px;
       border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);
       font-size:15px;line-height:1.35;cursor:pointer;transition:.15s;font-family:inherit}
  .opt:hover:not(:disabled){background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.25)}
  .opt:disabled{cursor:default}
  .opt.ok{background:rgba(22,163,74,.22);border-color:var(--ok)}
  .opt.bad{background:rgba(239,68,68,.18);border-color:var(--bad)}
  .opt.picked{background:rgba(59,130,246,.20);border-color:var(--pick)}
  .opt .mark{float:right;font-weight:700;margin-left:8px}
  .row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
  .btn{border:0;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;
       background:var(--accent);color:#0b1023;font-family:inherit}
  .btn.ghost{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--line)}
  .btn:disabled{opacity:.45;cursor:default}
  .hint{font-size:13px;color:var(--muted)}
  .menu .btn{display:block;width:100%;margin-bottom:12px;padding:16px 20px;text-align:left}
  .menu .btn small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:4px}
  .result{text-align:center}
  .result .score{font-size:44px;font-weight:800;margin:14px 0;color:var(--accent)}
  .result .pct{font-size:16px;color:var(--muted);margin-bottom:18px}
  .review{text-align:left;margin-top:18px}
  .review h3{font-size:15px;margin-bottom:10px;color:var(--muted)}
  .review .item{border-left:3px solid var(--bad);padding:8px 12px;margin-bottom:10px;background:rgba(239,68,68,.07);border-radius:0 10px 10px 0}
  .review .item .q{font-size:14px;margin-bottom:4px}
  .review .item .a{font-size:13px;color:#fca5a5}
  .review .item .b{font-size:13px;color:#86efac}
  .jumpbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .jumpbar input{width:120px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
                 background:rgba(255,255,255,.05);color:var(--text);font-family:inherit;font-size:14px}
  .jumpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;
            max-height:250px;overflow-y:auto;padding:10px;margin-bottom:12px;border-radius:14px;
            background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .jumpgrid button{padding:8px 0;border-radius:8px;border:1px solid var(--line);
                   background:rgba(255,255,255,.05);color:var(--text);font-size:12px;cursor:pointer;font-family:inherit}
  .jumpgrid button:hover{background:rgba(255,255,255,.12)}
  .jumpgrid button.cur{background:var(--accent);color:#0b1023;font-weight:700}
  .jumpgrid button.done{opacity:.5}
  @media(max-width:520px){
    body{padding:18px 10px 44px}
    h1{font-size:22px}
    .sub{font-size:13px;margin-bottom:14px}
    .card{padding:16px;border-radius:14px}
    .qtext{font-size:16px;line-height:1.4}
    .opt{font-size:14.5px;padding:13px 14px;margin-bottom:8px}
    .btn{padding:12px 16px;font-size:14px}
    .jumpbar{gap:6px}
    .jumpbar input{width:88px;font-size:14px}
    .jumpbar .hint{font-size:11px;flex-basis:100%}
    .jumpgrid{grid-template-columns:repeat(auto-fill,minmax(44px,1fr));max-height:200px}
    .meta{font-size:12px}
    .review .item .q{font-size:13.5px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← Все предметы</a>
    <span class="hint" id="counter"></span>
  </div>
  <h1>Латинский</h1>
  <div class="sub">Всего вопросов: <b>295</b></div>

  <div id="menu" class="card menu">
    <button class="btn" onclick="start('train','seq')">🎯 Тренировка — все 295 по порядку<small>Вопросы идут по номеру, сразу видно ответ</small></button>
    <button class="btn ghost" onclick="start('train','rand')">🔀 Тренировка — все 295 вразброс<small>Перемешаны, сразу видно ответ</small></button>
    <button class="btn ghost" onclick="start('exam',20)">📝 Экзамен — 20 случайных<small>Без подсказок, разбор ошибок в конце</small></button>
    <button class="btn ghost" onclick="start('exam',50)">📝 Экзамен — 50 случайных<small>Без подсказок, разбор ошибок в конце</small></button>
  </div>

  <div id="quiz" style="display:none">
    <div class="jumpbar">
      <button class="btn ghost" id="toggleJump">📋 Список вопросов</button>
      <input id="jumpNum" type="number" min="1" placeholder="№ вопроса">
      <button class="btn ghost" id="goNum">→</button>
      <span class="hint">можно перейти к любому вопросу</span>
    </div>
    <div class="jumpgrid" id="jumpgrid" style="display:none"></div>
    <div class="progress"><i id="pbar"></i></div>
    <div class="meta"><span id="qpos"></span><span id="score"></span></div>
    <div class="card" id="card"></div>
    <div class="row">
      <button class="btn" id="next" disabled>Далее →</button>
      <span class="hint" id="status"></span>
    </div>
  </div>

  <div id="done" style="display:none" class="card result">
    <h2>Результат</h2>
    <div class="score" id="finalScore">0</div>
    <div class="pct" id="finalPct"></div>
    <div class="review" id="review"></div>
    <div class="row" style="justify-content:center;margin-top:20px">
      <button class="btn" onclick="start(mode, lastSize)">Ещё раз</button>
      <button class="btn ghost" onclick="toMenu()">К выбору режима</button>
    </div>
  </div>
</div>

 arteriae", "arteriae renalis hyperlasiae symptomata", "renalis hyperlasiae symptomata arteriae"], "answer": 0}, {"num": 298, "text": "Укажите последовательность слов в термине “лечение острой долевой пневмонии”:", "options": ["curatio pneumoniae lobularis acutae", "curatio pneumoniae acutae lobularis", "lobularis curatio pneumoniae acutae", "acutae curatio pneumoniae lobularis"], "answer": 0}, {"num": 299, "text": "Укажите последовательность слов в термине “лечение острого аллергического ринита”:", "options": ["curatio rhinitis allergicae acutae", "curatio allergicae acutae rhinitis", "allergicae curatio acutae rhinitis", "curatio acutae rhinitis allergicae"], "answer": 0}, {"num": 300, "text": "Выберите препарат женских половых гормонов:", "options": ["Aethinyloestradiolum", "Hydrocortisonum", "Euthyrox", "Testoenatum 1"], "answer": 0}]};
const ALL = DATA.questions;
const EXAM_SIZE = 20;
let mode = 'train', lastSize = 0, queue = [], idx = 0, correct = 0, wrong = [], picks = [];

const el = (id) => document.getElementById(id);

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function toMenu() {
  el('menu').style.display = 'block';
  el('quiz').style.display = 'none';
  el('done').style.display = 'none';
}

// ── переход к любому вопросу ──
function buildJump() {
  const g = el('jumpgrid');
  g.innerHTML = '';
  queue.forEach((q, k) => {
    const b = document.createElement('button');
    b.textContent = q.num;
    b.dataset.k = k;
    b.onclick = () => goTo(k);
    g.appendChild(b);
  });
  markJump();
}

function markJump() {
  const g = el('jumpgrid');
  if (!g) return;
  [...g.children].forEach((b) => b.classList.toggle('cur', Number(b.dataset.k) === idx));
}

function goTo(k) {
  if (k < 0 || k >= queue.length) return;
  clearTimeout(window.__adv);
  idx = k;
  render();
}

function start(m, size) {
  mode = m;
  lastSize = size;
  clearTimeout(window.__adv);
  if (m === 'train') {
    queue = (size === 'seq') ? ALL.slice() : shuffle(ALL);
  } else {
    queue = shuffle(ALL).slice(0, Math.min(Number(size) || 20, ALL.length));
  }
  idx = 0; correct = 0; wrong = []; picks = [];
  el('menu').style.display = 'none';
  el('done').style.display = 'none';
  el('quiz').style.display = 'block';
  buildJump();
  render();
}

function render() {
  const q = queue[idx];
  el('qpos').textContent = 'Вопрос ' + (idx + 1) + ' из ' + queue.length;
  el('score').textContent = mode === 'exam' ? 'Отвечено: ' + picks.length : 'Правильно: ' + correct;
  el('pbar').style.width = (idx / queue.length * 100) + '%';
  el('next').disabled = true;
  el('status').textContent = '';
  markJump();
  const card = el('card');
  card.innerHTML = '<div class="qnum">№ ' + q.num + '</div><div class="qtext"></div>';
  card.querySelector('.qtext').textContent = q.text;
  q.options.forEach((opt, k) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => pick(b, k, q);
    card.appendChild(b);
  });
}

function pick(btn, k, q) {
  const buttons = [...document.querySelectorAll('.opt')];
  buttons.forEach(b => b.disabled = true);
  picks.push(k);

  const right = q.answer;
  if (mode === 'train') {
    if (right >= 0) {
      buttons[right].classList.add('ok');
      buttons[right].insertAdjacentHTML('beforeend', '<span class="mark">✓</span>');
    }
    if (k === right) { correct++; el('status').textContent = 'Верно ✓'; }
    else {
      btn.classList.add('bad');
      btn.insertAdjacentHTML('beforeend', '<span class="mark">✗</span>');
      el('status').textContent = right >= 0 ? 'Неверно ✗' : 'Ответ не размечен';
    }
    el('score').textContent = 'Правильно: ' + correct;
  } else {
    // экзамен: без подсказок
    btn.classList.add('picked');
    el('status').textContent = 'Отвечено · далее…';
    if (k !== right) wrong.push({q, k});
  }

  el('next').disabled = false;
  clearTimeout(window.__adv);
  window.__adv = setTimeout(() => { if (!el('next').disabled) el('next').click(); }, 1000);
}

el('next').onclick = () => {
  clearTimeout(window.__adv);
  if (idx < queue.length - 1) { idx++; render(); }
  else { finish(); }
};

// кнопка «Список вопросов»
el('toggleJump').onclick = () => {
  const g = el('jumpgrid');
  g.style.display = (g.style.display === 'none') ? 'grid' : 'none';
};

// переход по номеру вопроса
el('goNum').onclick = () => {
  const n = parseInt(el('jumpNum').value, 10);
  if (!n) return;
  const k = queue.findIndex((q) => q.num === n);
  if (k >= 0) { goTo(k); el('jumpNum').value = ''; }
  else { el('status').textContent = 'Вопроса №' + n + ' нет в этом списке'; }
};
el('jumpNum').addEventListener('keydown', (e) => { if (e.key === 'Enter') el('goNum').click(); });

function finish() {  el('quiz').style.display = 'none';
  el('done').style.display = 'block';
  el('pbar').style.width = '100%';
  const total = queue.length;
  const rights = mode === 'exam' ? (total - wrong.length) : correct;
  el('finalScore').textContent = rights + ' / ' + total;
  el('finalPct').textContent = Math.round(rights / total * 100) + '% правильных · ' +
      (mode === 'exam' ? ('экзамен ' + queue.length + ' вопр.') : (lastSize === 'seq' ? 'тренировка по порядку' : 'тренировка вразброс'));

  const rev = el('review');
  rev.innerHTML = '';
  if (mode === 'exam' && wrong.length) {
    const h = document.createElement('h3');
    h.textContent = 'Ошибки (' + wrong.length + '):';
    rev.appendChild(h);
    wrong.forEach(({q, k}) => {
      const it = document.createElement('div');
      it.className = 'item';
      it.innerHTML = '<div class="q"></div><div class="a"></div><div class="b"></div>';
      it.querySelector('.q').textContent = '№ ' + q.num + '. ' + q.text;
      it.querySelector('.a').textContent = 'Ваш ответ: ' + (q.options[k] || '—');
      it.querySelector('.b').textContent = 'Правильно: ' + (q.answer >= 0 ? q.options[q.answer] : 'не размечено');
      rev.appendChild(it);
    });
  }
}

</script>
